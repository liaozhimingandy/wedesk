# =============================================================================
# WeDesk 自建服务器 (hbbs + hbbr) —— 团队私有化部署
# =============================================================================
# 端口映射写法（而非 network_mode: host），保证在 Linux 服务器、Windows Docker
# Desktop、macOS 上都能直接跑起来。若要上生产 Linux 服务器，可参考文件末尾注释
# 切换到 host 网络以获得真实来源 IP 与更低延迟。
#
# 使用前请把同目录下的 .env.example 复制为 .env，并填写 RELAY_HOST。
# =============================================================================
# 【端口是怎么定下来的 —— 改之前务必先看这段】
#
# 这里的端口不是一张可以随便编的清单，而是从两个"主端口"推导出来的：
#
#   hbbs 主端口 P = 5187   →  UDP P(5187)   注册 / 心跳
#                             TCP P(5187)   TCP 打洞与连接
#                             TCP P-1(5186) NAT 类型探测
#                             TCP P+2(5189) WebSocket（备用注册通道，见下）
#   hbbr 主端口 R = 5188   →  TCP R(5188)   中继数据
#                             TCP R+2(5190) WebSocket 中继
#
#   ★ 5189 / 5190 现在默认 publish。原因（2026-10-20 排障实证）：
#     客户端在 UDP 不通或用户勾了"使用 WebSocket"时，会改用 P+2 这个 WS 端口
#     去注册；而这个端口如果外部摸不到，客户端就会一直卡在
#     "正在接入网络"，日志里反复出现
#         start tcp: ws://<host>:5189
#         rendezvous mediator error: deadline has elapsed
#     —— 也就是说，不开这两个口子 = 一部分客户端永远注册不上。
#     上游"不要开"的建议是针对**前面挂了反向代理**的场景：WS 分支会信任
#     X-Real-IP / X-Forwarded-For 且不校验来源，有代理时客户端可借此伪造 IP。
#     直连 publish 没有代理插手，风险等级远低于"注册不上"。若你在前面挂了
#     nginx 之类，请让代理**覆写**这两个头，或注释掉下面两条映射。
#
#   5185 = 客户端按 P-2 推导出来的 api-server（心跳 / 设备台账 / 地址簿同步）。
#   hbbs 本身【不监听】这个端口 —— 那是独立的 API 服务（官方 SaaS 才有）。
#   自建部署没有它，客户端日志会有一条 Heartbeat failed 的 WARN，连续 3 次
#   后自动停搏，属正常现象，不用管。想彻底消掉可在客户端关闭"注册设备"。
#
# 源码位置：hbbs 见 src/rendezvous_server.rs 的 nat_port = port - 1 / ws_port = port + 2；
#          hbbr 见 src/relay_server.rs 的 port2 = port + 2。它们没有开关可关。
#
# 所以要塞进 5186-5189 这四个号，P 只能取 5187（P-1=5186、P+2=5189 都在范围内），
# R 只能取 5188。这也是为什么下面每条映射的左右两侧用同一个变量：
#   左侧是宿主机端口，右侧是容器内端口，而容器端口由 command 里的 -p 决定，
#   两者必须永远相等 —— 改成 9000:5187 只会得到"端口开着但连不上"。
# 想整体平移，就改 HBBS_PORT / HBBR_PORT / HBBS_NAT_PORT 三个值并保持
# HBBS_NAT_PORT == HBBS_PORT-1（rdctl.py start 会校验这个关系）。
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # hbbs : ID 注册 / 心跳 / NAT 打洞协调
  # ---------------------------------------------------------------------------
  hbbs:
    # 镜像来自 deploy/ 的 Dockerfile —— 源码在 ../src/，编译时就在容器里跑，
    # 不依赖 rustdesk/rustdesk-server 官方镜像。
    # 首次启动前先执行一次 `docker compose build`（或 `docker compose up --build`）。
    image: ${RD_IMAGE:-wedesk-server:latest}
    build: &wedesk-build
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: rd-hbbs
    # -p  : 主端口，派生出 NAT(P-1) 与 WS(P+2)。写成变量是为了让下面 ports 段
    #       能跟着一起变，避免"一边改一边没改"这种最难查的错。
    # -r  : 告诉客户端中继在哪台机器上。**必须带端口**，否则 hbbs 会按默认的
    #       21117 拼出来 src/rendezvous_server.rs 的第 1322 行），
    #       客户端会被指到一个没人监听的端口，表现为"能注册但连不上桌面"。
    command: hbbs -p ${HBBS_PORT:-5187} -r ${RELAY_HOST:-127.0.0.1}:${HBBR_PORT:-5188}
    environment:
      # 强制所有连接走中继。团队成员若分布在不同内网，开启可提高连通率，
      # 代价是所有流量经过服务器消耗带宽。内网环境建议设为 N 走 P2P 直连。
      - ALWAYS_USE_RELAY=${ALWAYS_USE_RELAY:-N}
      # 允许中继到非本机地址（relay host 与 hbbs 不同机器时需要）
      - ENFORCED_RELAY=${ENFORCED_RELAY:-N}
      # ---- 数据库后端 ---------------------------------------------------
      # postgres（默认）| sqlite
      #
      # ⚠️ 官方 rustdesk/rustdesk-server 镜像【不认识 DB_TYPE】，配了也不会报错，
      #    只是静默继续写 SQLite —— 等你发现 ID 没进 PostgreSQL 已经攒了一堆数据。
      #    只有本仓库 server/src 编出来的镜像（默认 RD_IMAGE 就是它）才支持。
      #    拿不准就跑 `rdctl.py doctor`，它会直接告诉你数据实际落在哪。
      - DB_TYPE=${DB_TYPE:-postgres}
      #
      # DB_URL 的含义随 DB_TYPE 变化：
      #   sqlite   → 容器内文件路径，默认 /root/db_v2.sqlite3（即挂载的 ./data）
      #   postgres → 连接串 postgres://<user>:<password>@<host>:5432/<db>
      #
      # 默认用下面 PG_* 拼出内置容器的连接串，与 postgres 服务一一对应。
      # 想接外部 / 托管 Postgres，直接把这一行整个替换成你的连接串即可
      # （此时 compose 里的 postgres 服务仍在跑，若不需要可加
      #   `docker compose up -d --scale postgres=0` 停掉）。
      #
      # 主机名必须是 postgres（compose 服务名，compose 网络里有 DNS 记录）；
      # 不要写成 rd-postgres 或 127.0.0.1 —— 那是容器名/回环，两个都不通。
      - DB_URL=${DB_URL:-postgres://${PG_USER:-rustdesk}:${PG_PASSWORD:-changeme}@postgres:5432/${PG_DB:-rustdesk}}
      #
      # 库内共三张表，启动时自动建（幂等），无需手工初始化：
      #   peer           ID / 设备台账（ID、uuid、公钥、备注、注册信息、状态）
      #   server_config  旧版密钥托管残留（升级后启动时会自动迁出并清空）
      #   connection_log 连接审计 —— 谁连了谁、时间、走中继还是 P2P
      #
      # ⚠️ 密钥已退出数据库（2026-10-20 起）：私钥只从文件读取，避免随库泄露。
      #    docker secrets 标准方式挂载（内容 = 64 字节私钥的 base64，同 id_ed25519）：
      #      - /d/Git/secrets/id_ed25519:/run/secrets/id_ed25519:ro
      #    多实例共享同一套 ID：所有实例挂载同一个 secret 文件即可。
      #    也可用 KEY_FILE 环境变量显式指定任意路径。
      - AUDIT_LOG=${AUDIT_LOG:-Y}
      - AUDIT_FLUSH_SECS=${AUDIT_FLUSH_SECS:-5}
      - AUDIT_MAX_BUFFER=${AUDIT_MAX_BUFFER:-20000}
      # 连接池大小。**刻意留空**：留空则两个后端各用自己的合理默认值
      #   sqlite → 1（写操作串行，连接多了只会更容易撞 database is locked）
      #   postgres → 8
      # 这里一旦写死某个数字，默认的 SQLite 路径也会被迫用它，偏离上游行为。
      - MAX_DATABASE_CONNECTIONS=${MAX_DATABASE_CONNECTIONS:-}
      # 首次连库失败的重试次数（仅 postgres 后端，间隔 3 秒，默认 10 次）。
      # 留空即用默认值；设 1 表示"连不上就立刻失败，交给编排器重启"。
      - DB_CONNECT_RETRIES=${DB_CONNECT_RETRIES:-}
      # 默认 warn 而非 info：hbbs 在 info 级别下每注册/心跳都落一行日志，
      # 长期运行的磁盘写入与格式化开销是可观测的，而排障时临时调高即可。
      - RUST_LOG=${RUST_LOG:-warn}
      # 健康检查 HTTP 端口（GET /health）。与上面的 ports 映射保持一致；
      # 设 0 可关闭。探针会顺带 select 1 探数据库，库挂了回 503。
      - HEALTH_PORT=${HBBS_HEALTH_PORT:-5191}
    volumes:
      # 密钥(id_ed25519 / id_ed25519.pub)与 SQLite 数据库落在此目录，务必定期备份
      - ./data:/root
      # 密钥改由 docker secrets 标准方式挂载（只读），库中不再保存密钥。
      # 把宿主机的私钥文件挂进 /run/secrets/ 即可被自动识别；注释掉下面这行
      # 则回退为 ./data/id_ed25519（工作目录文件，首次启动自动生成）。
      # - /d/Git/secrets/id_ed25519:/run/secrets/id_ed25519:ro
    ports:
      # 5186 / 5187 是客户端真正要连的三个口子（5186 TCP、5187 TCP + UDP）。
      # 5187 同时用 TCP 与 UDP，Docker 里 "5187:5187" 只 publish TCP，
      # UDP 必须单独写一条 "/udp" —— 下面看着像重复，实际是同一端口的两种协议，
      # 缺了 UDP 那条，客户端的注册就永远超时。
      - "${HBBS_NAT_PORT:-5186}:${HBBS_NAT_PORT:-5186}"   # NAT 类型探测 (TCP) = P-1
      - "${HBBS_PORT:-5187}:${HBBS_PORT:-5187}"           # 注册/心跳 + TCP 打洞 (TCP)
      - "${HBBS_PORT:-5187}:${HBBS_PORT:-5187}/udp"       # 注册 + 心跳 (UDP)
      #
      # 5191 = hbbs 健康检查 HTTP（GET /health，默认 = 主端口+4）。
      # 容器内 healthcheck 用它自检；外部监控（Prometheus blackbox / 拨测 /
      # 负载均衡探针）也从这里拿 JSON 状态。改 HBBS_PORT 时同步改 HBBS_HEALTH_PORT。
      - "${HBBS_HEALTH_PORT:-5191}:${HBBS_HEALTH_PORT:-5191}"
      #
      # 5189 = hbbs 的 WebSocket 端口（= P+2），客户端在 UDP 不通 / 勾选了
      # "使用 WebSocket" 时用它注册。**默认 publish**：不开的话这类客户端会
      # 永远卡在"正在接入网络"。
      # 取值必须恒等于 HBBS_PORT + 2，改 HBBS_PORT 时同步改 HBBS_WS_PORT。
      # ⚠️ 前置了反向代理时请让代理覆写 X-Real-IP / X-Forwarded-For，否则客户端
      #    可以伪造来源 IP 绕过限流并污染审计日志；那种情况请注释掉下面这行。
      - "${HBBS_WS_PORT:-5189}:${HBBS_WS_PORT:-5189}"
    # 这里用完整映射写法而不是列表，因为要给 postgres 加条件（列表形式不支持）。
    depends_on:
      hbbr:
        condition: service_started
      # Postgres 现在是默认后端，所以这里必须等它 healthy 再启动 hbbs，
      # 否则首次编排时 hbbs 会先连库失败（即便有重试也会在日志里留下一串错误）。
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rd-net
    # --- 健康自检 ---------------------------------------------------------
    # 每 30s 在容器内 curl 一次 /health：200 视为 healthy，503/超时视为
    # unhealthy（连续 3 次）。busybox wget 对 5xx 返回非 0，正好当探针。
    # `docker compose ps` 的 STATUS 列会显示 (healthy/unhealthy)。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${HBBS_HEALTH_PORT:-5191}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # --- 资源上限 ---------------------------------------------------------
    # hbbs 只做 ID 注册、心跳与打洞协调，不转发画面数据，实测常驻 10-40 MB。
    # 给 256 MB 是留足余量又能在异常时快速触发重启，而不是把宿主机拖垮。
    # 团队规模上千可适当调高；它不是性能瓶颈，别一上来就给 1 GB。
    mem_limit: ${HBBS_MEM:-256m}
    cpus: ${HBBS_CPUS:-0.50}
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # ---------------------------------------------------------------------------
  # hbbr : 中继服务器。P2P 打洞失败时兜底转发画面数据
  # ---------------------------------------------------------------------------
  hbbr:
    # 与 hbbs 同一个镜像、同一份构建配置（用 YAML 锚点复用上面的 build 段）
    image: ${RD_IMAGE:-wedesk-server:latest}
    build: *wedesk-build
    container_name: rd-hbbr
    # -p  : 中继主端口。注意是【命令行 -p】而不是环境变量 PORT ——
    #       hbbr.rs 里环境变量 PORT 会被 +1 之后再使用（历史包袱），
    #       写成 PORT=5188 它就去监听 5189，正好撞上 hbbs 的 WebSocket 端口。
    command: hbbr -p ${HBBR_PORT:-5188}
    environment:
      - RUST_LOG=${RUST_LOG:-warn}
      # 健康检查 HTTP 端口（GET /health，默认 = 中继主端口+4）。与下面
      # ports 映射保持一致；设 0 可关闭。hbbr 不碰数据库，探针只报自身存活。
      - HEALTH_PORT=${HBBR_HEALTH_PORT:-5192}
    volumes:
      - ./data:/root
    ports:
      - "${HBBR_PORT:-5188}:${HBBR_PORT:-5188}"      # 中继主端口 (TCP)
      - "${HBBR_HEALTH_PORT:-5192}:${HBBR_HEALTH_PORT:-5192}"  # 健康检查 HTTP
      #
      # 5190 = hbbr 的 WebSocket 中继端口（= R+2）。与 hbbs 的 5189 同理默认
      # publish：Web 客户端与"强制 WebSocket"的客户端要靠它走中继。
      # 取值必须恒等于 HBBR_PORT + 2。前置反代时同上，注释掉本行。
      - "${HBBR_WS_PORT:-5190}:${HBBR_WS_PORT:-5190}"
    restart: unless-stopped
    networks:
      - rd-net
    # --- 健康自检（与 hbbs 同款；hbbr 不连库，探针只报自身存活） ----------
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${HBBR_HEALTH_PORT:-5192}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # --- 资源上限 ---------------------------------------------------------
    # hbbr 转发画面数据，内存占用随并发会话数线性增长（每路约几 MB 缓冲）。
    # 512 MB 足够支撑数十路并发中继；内存不是它的瓶颈，带宽才是
    # —— 若 ALWAYS_USE_RELAY=Y，请优先盯出网带宽而不是这里的数字。
    mem_limit: ${HBBR_MEM:-512m}
    cpus: ${HBBR_CPUS:-1.00}
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # ---------------------------------------------------------------------------
  # postgres : 服务端默认存储后端
  # ---------------------------------------------------------------------------
  # 与 hbbs 同一份 .env，三张表由 hbbs 启动时自动建（幂等），无需手工初始化。
  #
  # 想接外部 / 托管 Postgres（RDS 等）：把 .env 里的 DB_URL 改成你的连接串即可。
  # 本地这个容器就多余了，用下面任一条把它停掉（数据卷 ./pgdata 不会丢）：
  #   docker compose stop postgres
  #   docker compose up -d --scale postgres=0
  # 注意：hbbs 的 depends_on 要求 postgres 处于 healthy，所以【不要】用
  # profiles 把它摘掉 —— 那会让 hbbs 启动时等一个不存在的服务而卡住。
  #
  # 需要预先受管的 schema（比如要自定义分区、权限、扩展），把下面 volumes 里
  # 那行挂载打开即可 —— 注意它【只在首次初始化时】执行，已有数据卷不会重跑。
  #
  # 数据落在 ./pgdata，务必纳入备份：
  #   rdctl.py backup 会同时处理 SQLite 与 PostgreSQL 两种后端。
  # ---------------------------------------------------------------------------
  postgres:
    image: ${PG_IMAGE:-postgres:16-alpine}
    container_name: rd-postgres
    environment:
      - POSTGRES_DB=${PG_DB:-rustdesk}
      - POSTGRES_USER=${PG_USER:-rustdesk}
      # 生产务必改强口令；留空或保持 changeme 等于把设备台账敞开
      - POSTGRES_PASSWORD=${PG_PASSWORD:-changeme}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      # 可选：需要受管 schema 时打开下面的挂载（仅首次初始化生效）
      # - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-peer.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-rustdesk} -d ${PG_DB:-rustdesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - rd-net
    mem_limit: ${PG_MEM:-512m}
    cpus: ${PG_CPUS:-1.00}

networks:
  rd-net:
    name: rd-net
    driver: bridge

# =============================================================================
# 上生产 Linux 服务器时可用 host 网络换取真实来源 IP 与更低延迟：
#
#     network_mode: "host"      # 删掉上面的 ports: 与 networks: 段
#
# ⚠️ 一旦切 host，容器内外网络栈合一，5189/5190 直接对外。这两个口子现在是
#    "按需开放"—— 客户端要拿它们做 WebSocket 注册/中继，因此建议放行，
#    但只在确实需要 WebSocket 通道时才放行（多数内网客户端走 5187 UDP 即可）：
#
#       # 云安全组/iptables 都要做，按实际网卡与顺序调整
#       iptables -I INPUT -p tcp --dport 5186 -j ACCEPT   # NAT 探测
#       iptables -I INPUT -p tcp --dport 5187 -j ACCEPT   # 注册/TCP 打洞
#       iptables -I INPUT -p udp --dport 5187 -j ACCEPT   # 注册/心跳
#       iptables -I INPUT -p tcp --dport 5188 -j ACCEPT   # 中继
#       iptables -I INPUT -p tcp --dport 5189 -j ACCEPT   # hbbs WebSocket（按需）
#       iptables -I INPUT -p tcp --dport 5190 -j ACCEPT   # hbbr WebSocket（按需）
#
#    若确认所有客户端都能走 UDP 5187，就把 5189/5190 改成 DROP。
#    端口全景与规划建议见 docs/10-ports.md。
#    （--net=host 仅在 Linux 生效；Windows / macOS 请保持上面的端口映射写法）
# =============================================================================
