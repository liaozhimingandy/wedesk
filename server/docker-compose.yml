# =============================================================================
# RustDesk 自建服务器 (hbbs + hbbr) —— 团队私有化部署
# =============================================================================
# 端口映射写法（而非 network_mode: host），保证在 Linux 服务器、Windows Docker
# Desktop、macOS 上都能直接跑起来。若要上生产 Linux 服务器，可参考文件末尾注释
# 切换到 host 网络以获得真实来源 IP 与更低延迟。
#
# 使用前请把同目录下的 .env.example 复制为 .env，并填写 RELAY_HOST。
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # hbbs : ID 注册 / 心跳 / NAT 打洞协调
  # ---------------------------------------------------------------------------
  hbbs:
    # 镜像来自本目录的 Dockerfile —— 源码在 rustdesk-server/，编译时就在容器里跑，
    # 不依赖 rustdesk/rustdesk-server 官方镜像。
    # 首次启动前先执行一次 `docker compose build`（或 `docker compose up --build`）。
    image: ${RD_IMAGE:-wedesk-server:latest}
    build: &wedesk-build
      context: .
      dockerfile: Dockerfile
    container_name: rd-hbbs
    command: hbbs -r ${RELAY_HOST:-127.0.0.1}:${RELAY_PORT:-21117}
    environment:
      # 强制所有连接走中继。团队成员若分布在不同内网，开启可提高连通率，
      # 代价是所有流量经过服务器消耗带宽。内网环境建议设为 N 走 P2P 直连。
      - ALWAYS_USE_RELAY=${ALWAYS_USE_RELAY:-N}
      # 允许中继到非本机地址（relay host 与 hbbs 不同机器时需要）
      - ENFORCED_RELAY=${ENFORCED_RELAY:-N}
      # 数据库保留天数：连接 / 审计日志留存周期，团队排障与合规审计的关键参数
      - DB_URL=${DB_URL:-/root/db_v2.sqlite3}
      # 默认 warn 而非 info：hbbs 在 info 级别下每注册/心跳都落一行日志，
      # 长期运行的磁盘写入与格式化开销是可观测的，而排障时临时调高即可。
      - RUST_LOG=${RUST_LOG:-warn}
    volumes:
      # 密钥(id_ed25519 / id_ed25519.pub)与 SQLite 数据库落在此目录，务必定期备份
      - ./data:/root
    ports:
      # 端口写成 "主机:容器" 是为了后面能用 .env 覆盖主机侧，避免与宿主已有服务冲突。
      #
      # 注意 21118 / 21119 **没有**出现在这里 —— 这不是因为它们不存在：
      # hbbs/hbbr 进程在容器内部其实默认就监听 P+2 / R+2 这两个 WebSocket 端口，
      # 只是没有被 publish 出来，所以从宿主机外面扫不到。
      # 千万不要手贱加上这两行，也不要在没有防火墙的前提下改用 network_mode: host
      # —— host 网络会把容器里所有监听原样暴露到宿主 TCP 栈上，21118/21119 会一起
      # 对外开放，绕过下面的隔离。详见 docs/10-ports.md。
      # 21116 同时用 TCP 与 UDP，且必须是宿主同一端口号两侧一致；
      # Docker 里 "21116:21116" 只 publish TCP，UDP 要单独写一条 "/udp"，
      # 所以下面看着像重复，实际是同一端口的两种协议，缺一不可。
      - "${HBBS_NAT:-21115}:21115"       # NAT 类型探测        (TCP)
      - "${HBBS_TCP:-21116}:21116"       # ID 注册/心跳 + TCP 打洞 (TCP)
      - "${HBBS_UDP:-21116}:21116/udp"   # ID 注册 + 心跳      (UDP)
    depends_on:
      - hbbr
    restart: unless-stopped
    networks:
      - rd-net
    # --- 资源上限 ---------------------------------------------------------
    # hbbs 只做 ID 注册、心跳与打洞协调，不转发画面数据，实测常驻 10-40 MB。
    # 给 256 MB 是留足余量又能在异常时快速触发重启，而不是把宿主机拖垮。
    # 团队规模上千可适当调高；它不是性能瓶颈，别一上来就给 1 GB。
    mem_limit: ${HBBS_MEM:-256m}
    cpus: ${HBBS_CPUS:-0.50}
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # ---------------------------------------------------------------------------
  # hbbr : 中继服务器。P2P 打洞失败时兜底转发画面数据
  # ---------------------------------------------------------------------------
  hbbr:
    # 与 hbbs 同一个镜像、同一份构建配置（用 YAML 锚点复用上面的 build 段）
    image: ${RD_IMAGE:-wedesk-server:latest}
    build: *wedesk-build
    container_name: rd-hbbr
    command: hbbr
    environment:
      - RUST_LOG=${RUST_LOG:-warn}
    volumes:
      - ./data:/root
    ports:
      # hbbr 的容器侧还有一种"隐藏监听"：进程会顺带在 端口+2 (默认 21119) 上监听
      # WebSocket 中继。这里没有 publish 出去，所以外部不可达 —— 这是刻意的。
      # 原因见上游 issue #634：WebSocket 分支会无条件信任 X-Real-IP / X-Forwarded-For，
      # 且不校验来源。任何人直连该端口都能伪造 IP，绕过 IP 限流/封禁并污染审计日志。
      # 只有在前面挂了反向代理、由代理统一覆写该头时才可 publish，
      # 且必须用防火墙限制仅反代 IP 可访问。
      - "${HBBR_TCP:-21117}:21117"      # 中继主端口 (TCP)
    restart: unless-stopped
    networks:
      - rd-net
    # --- 资源上限 ---------------------------------------------------------
    # hbbr 转发画面数据，内存占用随并发会话数线性增长（每路约几 MB 缓冲）。
    # 512 MB 足够支撑数十路并发中继；内存不是它的瓶颈，带宽才是
    # —— 若 ALWAYS_USE_RELAY=Y，请优先盯出网带宽而不是这里的数字。
    mem_limit: ${HBBR_MEM:-512m}
    cpus: ${HBBR_CPUS:-1.00}
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

networks:
  rd-net:
    name: rd-net
    driver: bridge

# =============================================================================
# 上生产 Linux 服务器时可用 host 网络换取真实来源 IP 与更低延迟：
#
#     network_mode: "host"      # 删掉上面的 ports: 与 networks: 段
#
# ⚠️ 一旦切 host，上面"只在容器内监听、没 publish"的保护就消失了：
#    hbbs 的 21118、hbbr 的 21119 会直接暴露到宿主网络栈。
#    所以切之前必须先在防火墙里显式拒绝这两个端口（只放行 21115/21116/21117）：
#
#       # 云安全组/iptables 都要做，按实际网卡与顺序调整
#       iptables -I INPUT -p tcp --dport 21118 -j DROP
#       iptables -I INPUT -p tcp --dport 21119 -j DROP
#
#    端口全景与规划建议见 docs/10-ports.md。
#    （--net=host 仅在 Linux 生效；Windows / macOS 请保持上面的端口映射写法）
# =============================================================================
