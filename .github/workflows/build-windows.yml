# =============================================================================
# Wedesk —— 三端客户端（Windows / Android / iOS）+ 服务端构建
#
# 与上游 rustdesk/rustdesk 的关键差异（也是这份文件存在的理由）：
#
#   1. client/libs/hbb_common 等子模块已实体化（vendored），checkout 不需要 submodules，
#      clone 下来即可构建。省掉 --recursive 也避免了 submodule 拉不下来导致 CI 红。
#   2. 源码根 == 仓库根（扁平化），所有路径都是相对仓库根的。
#   3. 构建前会执行 build/client/customize.py 做品牌/服务器注入，
#      唯一输入是仓库里的 build/client/custom.toml（可用 workflow_dispatch 输入覆盖）。
#   4. 不签名。产物以 Artifact 供日常下载；推送 v* 标签时额外发布 GitHub Release。
#      iOS 只能产出未签名 IPA —— 签名要 Apple 开发者证书，属仓库 secrets。
#   5. 服务端 hbbs/hbbr 由 build-server job 在同一条流水线里编译 —— 文件名沿用
#      build-windows.yml 是为了保留既有的 Actions 连接与 badge，但这个文件现在
#      产出的是「三端客户端 + 服务端」，一次发版全都齐。
#
#      为什么不拆成第二条流水线：两条流水线都要往同一个 GitHub Release 传文件，
#      而发布 job 分属两个 workflow 就必然出现竞态 —— 谁先跑完谁创建 Release，
#      后到的要么覆盖、要么失败。合并进同一条流水线是这个竞态的根治手段。
#
#      三端客户端同理：它们共用同一份 bridge 产物、同一套品牌注入、同一个
#      版本号与同一套服务器密钥。分开跑就等于这三份输入各自漂移 ——
#      版本号对不齐、服务器地址只改了一端，都是反复会犯的错。
#
# 流水线为什么是两个 job（bridge + 各平台）：
#   bridge_generated.rs / generated_bridge.dart 是 flutter_rust_bridge 生成的，
#   且被 .gitignore 排除（构建产物不属于源码）。它们的生成依赖 cargo-expand +
#   dart pub get，跑起来不便宜，所以单独一个 job 做完再传给各平台 job，
#   也方便本地复用同样的产物。
#
# 为什么没有用 paths-ignore：
#   paths-ignore 对 tag push 同样生效（比较 tag 指向的 commit 与其父提交），
#   于是"最后一次提交只改了文档然后再打 tag"会静默不触发 —— 版本发布凭空消失，
#   且没有任何失败提示。所以改用 preflight 里的变更判断来跳构建，
#   既保住"改文档不烧 40 分钟机时"的收益，又保证 tag 一定能触发。
# =============================================================================

name: Build Wedesk (Client + Server)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hwcodec:
        description: "启用硬件编解码（NVENC/QSV/AMF）。关闭可省 40+ 分钟构建时间，但被控端只能软件编码，CPU 占用显著变高"
        type: boolean
        default: true
      build_args:
        description: "传给 client/build.py 的额外参数，例如 --vram（显存编码，进一步降低延迟与 CPU）"
        required: false
        default: "--vram"
      company_name:
        description: "公司/组织名，留空则沿用 build/client/custom.toml 里的值"
        required: false
        default: ""
      website:
        description: "官网地址，留空则沿用 build/client/custom.toml 里的值"
        required: false
        default: ""
      skip_customize:
        description: "跳过品牌注入（调试 CI 本身时用）"
        type: boolean
        default: false
      build_msi:
        description: "额外构建 MSI 安装包（较慢，有 continue-on-error 保护，失败不阻断便携版）"
        type: boolean
        default: true
      build_android:
        description: "构建 Android 客户端（按 ABI 分包 APK + AAB）"
        type: boolean
        default: true
      build_ios:
        description: "构建 iOS 客户端（未签名 IPA；macOS runner 分钟数是 Linux 的 10 倍，非发版可关）"
        type: boolean
        default: true
      build_macos:
        description: "构建 macOS 桌面客户端（.app；macOS runner 分钟数高，非发版可关）"
        type: boolean
        default: true
      build_linux:
        description: "构建 Linux 桌面客户端（x64 bundle）"
        type: boolean
        default: true

# 显式收敛权限：本流水线只上传 artifact，不需要写仓库
permissions:
  contents: read

env:
  # ---- 版本锁定，全部对齐上游 CI，改动前请先确认上游 flutter-build.yml ----
  RUST_VERSION: "1.75" # 1.78 有 i128 ABI 变更，会导致 sciter/bridge 不兼容
  FLUTTER_VERSION: "3.24.5"
  # bridge 用 3.22.3 生成，与上游一致：产物平台无关，但与 freezed 版本耦合
  FLUTTER_BRIDGE_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  LLVM_VERSION: "15.0.6"
  # vcpkg 版本：2026.07.29。改这个值记得同步更新 client/vcpkg.json 的 builtin-baseline
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_TRIPLET: "x64-windows-static"
  # x-gha 让 vcpkg 用 GitHub Actions Cache 当二进制缓存，
  # 少了这个每次都要重编译 aom/libvpx/ffmpeg，单次 40 分钟以上
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

  # ---- Android ----
  # NDK 版本对齐上游 flutter-build.yml。r25c 起才支持 armv7 的 NEON triplet，
  # 太旧的版本编 ffmpeg 会在汇编阶段失败。
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"

  # ---- 服务端（server/src 是独立 workspace，工具链单独定） ----
  # 服务端 Cargo.lock 是 lockfile v4，cargo < 1.78 读不了；它的依赖
  # （sqlx 0.6 / tokio 1.44+ / git 上游包）也普遍要求较新的编译器。
  # 客户端之所以锁 1.75 是 sciter/bridge 的 i128 ABI 之故，两个 workspace 互不干扰。
  #
  # 编译器版本不再在这里写 —— 它由 SERVER_BUILD_IMAGE 决定：服务端在 musl 容器里
  # 本机编译（见 build-server job 的说明），容器内自带 Rust，不再依赖 runner 上
  # 安装的工具链。要换版本就把这里和 server/deploy/Dockerfile 的 ARG RUST_IMAGE 一起改。
  SERVER_BUILD_IMAGE: "rust:1.90-alpine"
  SERVER_DIR: "server/src"
  # 目标三元组。必须与 server/deploy/build-musl.sh 的 TARGET 默认值、以及
  # server/deploy/Dockerfile 的 ARG TARGET 默认值三者一致 ——
  # cargo 只有在传了 --target 时才把产物放进 target/<triple>/，
  # 编译与打包一旦对 triple 的理解不一致，就会拼出 target//release 这种空路径。
  SERVER_TARGET: "x86_64-unknown-linux-musl"

  # ---- Docker Hub（服务端镜像发布目标） ----
  # 镜像完整名 = DH_NAMESPACE/DH_REPO = liaozhiming/wedesk-server
  # 登录用的 DOCKER_USERNAME / DOCKER_PASSWORD 走仓库 secrets，不写在这里。
  DH_NAMESPACE: "liaozhiming"
  DH_REPO: "wedesk-server"

jobs:
  # ---------------------------------------------------------------------------
  # 0. 前置校验：花 10 秒发现"配置写了但没注入"这类低级错误，
  #    好过让用户等到 40 分钟后才发现客户端连的还是官方服务器。
  # ---------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 需要完整历史才能 diff 出变更文件（gate）与生成 Release Notes
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------------
      # 构建门禁：代替 on.push.paths-ignore。
      # paths-ignore 会把"只改了文档的那次提交上打的 tag"一并过滤掉，
      # 导致 Release 静默不发布；这里改成显式判断，tag 一定放行。
      # ------------------------------------------------------------------
      - name: 判断是否需要构建
        id: gate
        shell: bash
        run: |
          set -e
          # tag push 必须构建：下游要发 Release，不能因为只改了文档就不产出
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag push（$GITHUB_REF_NAME）→ 构建并发布 Release"
            exit 0
          fi
          # 手动触发：用户点了就跑
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }} → 构建"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          # 首次推送时 before 是全 0，取不到 diff
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "首次推送 → 构建"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || true)"
          if [ -z "$CHANGED" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "无法判定变更范围 → 保守起见构建"
            exit 0
          fi
          if echo "$CHANGED" | grep -qvE '^(docs/|upstream/|.*\.md$)'; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "有代码变更 → 构建"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "仅文档 / 上游说明变更 → 跳过构建（省约 40 分钟机时）"
          fi
          echo ""
          echo "变更文件："
          echo "$CHANGED"

      - name: 确认仓库是自包含的（子模块已实体化）
        run: |
          set -e
          if [ -f .gitmodules ]; then
            echo "::error::检测到 .gitmodules —— 本仓库应已 vendored 全部子模块"
            exit 1
          fi
          # 上游 rustdesk-server 的 libs/hbb_common 也是 submodule。
          # 它要是空的，服务端编译会以"找不到 crate hbb_common"告终，
          # 而日志里看不出"其实是忘了初始化子模块"——所以在这里显式查。
          for f in \
            client/libs/hbb_common/src/lib.rs \
            client/libs/scrap/Cargo.toml \
            client/libs/enigo/Cargo.toml \
            ${{ env.SERVER_DIR }}/Cargo.toml \
            ${{ env.SERVER_DIR }}/src/main.rs \
            ${{ env.SERVER_DIR }}/libs/hbb_common/src/lib.rs; do
            if [ ! -f "$f" ]; then
              echo "::error::子模块未实体化: $f"
              exit 1
            fi
          done
          echo "✓ 客户端与服务端依赖均已实体化"

      # -------------------------------------------------------------------
      # shell 脚本的可执行位 —— 在 Windows 上会被静默丢掉
      #
      #   本机 core.filemode=false（Windows 默认），git 不追踪工作区权限位，
      #   于是一次"把客户端整棵树收进 client/"的重构就把 16 个 .sh 全部
      #   提交成了 100644。CI 里 ./xxx.sh 直接 Permission denied（退出 126），
      #   而 bash 的报错 "Permission denied" 里既没有 error 也没有 failed，
      #   挑错误行的诊断什么都挑不出来 —— 表现为"vcpkg 一步就挂、日志却是空的"。
      #   排查成本：整整两轮 CI。
      #
      #   这里几秒钟就能查出来。改脚本时注意用 git update-index --chmod=+x，
      #   单纯 chmod 在 core.filemode=false 下不会被 git 看到。
      # -------------------------------------------------------------------
      - name: 确认 shell 脚本有可执行位
        shell: bash
        run: |
          set -e
          bad=0
          while IFS= read -r f; do
            if [ ! -x "$f" ]; then
              echo "::error::$f 缺少可执行位（索引里是 100644）—— CI 里 ./$f 会 Permission denied。修复：git update-index --chmod=+x \"$f\"（Windows 上 chmod 不生效，必须用 update-index）"
              bad=1
            fi
          done < <(git ls-files '*.sh')
          [ "$bad" = "0" ] || exit 1
          echo "✓ 全部 shell 脚本可执行位正常"

      # -------------------------------------------------------------------
      # 编译期必需的非源码文件 —— 漏一个就要等十几分钟 musl 编译后才暴露
      # -------------------------------------------------------------------
      # 2026-10-16 实测：重构提交把 db_v2.sqlite3 漏移了，CI 连挂三次，
      # 每次都要跑到 musl 容器里编译十几分钟才报
      #     error: could not compile `hbbs` (lib) due to 4 previous errors
      # 那 4 个错误就是 database.rs 里 4 个 sqlx query! 宏 —— 它们编译期要连
      # 一个真实 SQLite 库校验 SQL（peer 表的 9 个列）。DATABASE_URL 指向它。
      # 这类"文件在但不在 git 里"的漏移，在这里几秒钟就能查出来。
      - name: 确认编译期必需文件在位
        run: |
          set -e
          for f in \
            ${{ env.SERVER_DIR }}/db_v2.sqlite3 \
            ${{ env.SERVER_DIR }}/Cargo.lock \
            client/vcpkg.json \
            client/build.py \
            client/flutter/pubspec.yaml \
            client/flutter/build_android_deps.sh \
            client/flutter/ndk_arm64.sh \
            client/flutter/android/app/build.gradle \
            client/flutter/ios/Runner.xcodeproj/project.pbxproj; do
            if [ ! -f "$f" ]; then
              echo "::error::编译期必需文件缺失: $f"
              echo "::error::若是重构/迁移漏移，用 git log --diff-filter=D -- <路径> 找回。"
              exit 1
            fi
            echo "  [OK] $f"
          done
          # db_v2.sqlite3 还得真的是个能打开的 SQLite 库、且含 peer 表。
          # 只查"文件存在"不够：空文件/占位文件/文本文件同样会让 sqlx 宏在编译期炸，
          # 而那要等十几分钟 musl 编译后才报 4 个看不懂的错误。
          python - "${{ env.SERVER_DIR }}/db_v2.sqlite3" <<'PY'
          import sqlite3, sys
          path = sys.argv[1]
          try:
              con = sqlite3.connect(path)
              tables = {r[0] for r in con.execute(
                  "select name from sqlite_master where type='table'")}
          except sqlite3.DatabaseError as e:
              sys.exit(f"[x] {path} 打不开或不是 SQLite 库: {e}")
          if "peer" not in tables:
              sys.exit(f"[x] {path} 里没有 peer 表（实际表: {sorted(tables) or '空'}）"
                       " —— sqlx 宏编译期校验会失败")
          cols = {r[1] for r in con.execute("pragma table_info(peer)")}
          need = {"guid", "id", "uuid", "pk", "created_at", "user", "status", "note", "info"}
          missing = need - cols
          if missing:
              sys.exit(f"[x] peer 表缺列: {sorted(missing)}")
          print(f"  [OK] {path}: peer 表含全部 {len(need)} 个列")
          PY
          echo "✓ 编译期必需文件均在位"

      - name: 品牌注入预演（不写盘）
        run: |
          set -e
          python build/client/customize.py --source client --config build/client/custom.toml --dry-run
          if grep -rq "Purslane Tech Pte. Ltd." client/Cargo.toml client/flutter/windows/runner/Runner.rc; then
            echo "::error::仍残留上游公司名 —— 请执行 python build/client/customize.py"
            exit 1
          fi
          # 占位符守卫：重构提交曾把 Cargo.toml/Runner.rc 的公司名打回
          # "贵公司名称" 而 CI 全绿（旧检查只认 Purslane），产物带着占位符出厂。
          if grep -rq "贵公司名称" client/Cargo.toml client/flutter/windows/runner/Runner.rc; then
            echo "::error::公司名仍是占位符 —— 填写 build/client/custom.toml 的 brand.company_name 后重跑 customize.py"
            exit 1
          fi
          # 公司名守卫：上述两个文件之外，macOS About 版权行、便携版 winres、
          # 服务端 --help 作者行也都曾带着上游公司名出厂。
          # preprocess.py 只查 --manufacturer 默认值那一处 —— 它里面还有一行
          # 是有意在打包时替换 License.rtf 里 Purslane 的正则，不能一锅端。
          if grep -rq "Purslane" client/Cargo.toml client/flutter/windows/runner/Runner.rc \
                 client/flutter/macos/Runner/Configs/AppInfo.xcconfig client/libs/portable/Cargo.toml \
                 server/src/src/common.rs server/src/src/hbbr.rs; then
            echo "::error::仍残留上游公司名 Purslane —— 请执行 python build/client/customize.py"
            exit 1
          fi
          if grep -q 'default="Purslane' client/res/msi/preprocess.py; then
            echo "::error::MSI 制造商仍是上游默认值 —— 请执行 python build/client/customize.py"
            exit 1
          fi
          # 包名守卫：上游遗留 com.carriez.*（RustDesk 作者域名）。包名是各平台
          # 应用商店的唯一标识，漏改任何一处都会导致上架被拒/更新不互通。
          if grep -rq --exclude="*.rd.bak" "com.carriez" client/flutter/android client/flutter/ios client/flutter/macos client/flutter/linux client/src client/libs client/res client/Cargo.toml server/src; then
            echo "::error::仍残留上游包名 com.carriez.* —— 包名定制见 build/client/custom.toml 的 brand.package_name"
            exit 1
          fi
          if grep -q 'rust-ny.rustdesk.com' client/libs/hbb_common/src/config.rs; then
            echo "::error::服务器地址仍是官方默认值"
            exit 1
          fi
          echo "✓ 品牌/服务器定制已就位"

  # ---------------------------------------------------------------------------
  # 1. 生成 flutter-rust-bridge 胶水代码
  #    产物平台无关，所以在 Linux 上生成（与上流 CI 完全同版本组合，风险最低）
  # ---------------------------------------------------------------------------
  generate-bridge:
    # PR 只做 preflight，不烧 40 分钟构建机时；仅文档变更的提交同理跳过。
    # 注意不是用 concurrency 取消，而是直接不触发：vcpkg 的二进制缓存有读写竞争，
    # 频繁取消/重跑反而容易把缓存写坏。
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.should_build == 'true' }}
    # 必须显式 needs 才能访问 needs.preflight.outputs —— 否则 context 为空，
    # 上面那个 == 'true' 恒不成立，这个 job 永远不跑
    needs: [preflight]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ libclang-dev libgtk-3-dev \
            llvm-dev nasm ninja-build pkg-config wget fuse libfuse2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: wedesk-bridge

      # 关键：codegen 二进制装到独立的根目录再缓存。
      # 若直接 cargo install 到默认的 ~/.cargo/bin，缓存它又会污染 Rust 命令本身，
      # 两者互相踩。"安装到独立目录"避免了这个耦合。
      - name: Cache flutter_rust_bridge_codegen
        id: cache-frb
        uses: actions/cache@v4
        with:
          path: build/client/.tools/frb
          key: frb-${{ runner.os }}-${{ env.FLUTTER_RUST_BRIDGE_VERSION }}-ce${{ env.CARGO_EXPAND_VERSION }}-rust${{ env.RUST_VERSION }}

      - name: Install flutter rust bridge deps
        if: steps.cache-frb.outputs.cache-hit != 'true'
        run: |
          set -e
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked --root "$PWD/build/client/.tools/frb"
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} \
            --features uuid --locked --root "$PWD/build/client/.tools/frb"

      - name: Install flutter (bridge generation only)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_BRIDGE_VERSION }}
          cache: true

      - name: Downgrade extended_text for Dart 3.22
        # Flutter 3.22.3 的 Dart 解析不了 extended_text 14，降到 13 才能 pub get。
        # 只影响 bridge 生成，Windows 侧用的是仓库原始的 pubspec。
        run: |
          cd client/flutter
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get

      - name: Run flutter rust bridge
        run: |
          set -e
          "$PWD/build/client/.tools/frb/bin/flutter_rust_bridge_codegen" \
            --rust-input ./client/src/flutter_ffi.rs \
            --dart-output ./client/flutter/lib/generated_bridge.dart \
            --c-output ./client/flutter/macos/Runner/bridge_generated.h
          cp ./client/flutter/macos/Runner/bridge_generated.h ./client/flutter/ios/Runner/bridge_generated.h
          ls -l ./client/src/bridge_generated*.rs ./client/flutter/lib/generated_bridge*.dart

      # 打成 tar 包再上传，而不是把这六个路径直接交给 upload-artifact ——
      # 这是 2026-10-17 起 Windows 构建连挂的元凶，且报错完全指不到真因：
      #
      #   upload-artifact@v4 在 path 收到【多个路径】时，会用它们的最近公共
      #   父目录当 artifact 的根目录。这六个文件的公共父目录是 client/，
      #   于是 client/ 这一层被剥掉；下载到仓库根之后，文件落进 ./src/
      #   而不是 ./client/src/。cargo 要的是 client/src/bridge_generated.rs，
      #   拿不到就报
      #     error[E0583]: file not found for module `bridge_generated`
      #   而这个错误要等几百个依赖全部编译完才出现 —— 白等十分钟，
      #   且报错信息只会指向"模块文件不存在"，指不到"artifact 解包位置错了"。
      #
      #   客户端整棵树收进 client/ 之前，公共父目录正好是仓库根，
      #   剥掉后路径依然正确 —— 所以这个坑只在重构之后才显形。
      #
      # tar 包内的路径由 tar 自己定义，与 action 的路径推断无关，
      # 也就不会再随仓库结构变化而漂移。
      - name: Package bridge files
        shell: bash
        run: |
          set -e
          FILES=""
          for f in \
            client/src/bridge_generated.rs \
            client/src/bridge_generated.io.rs \
            client/flutter/lib/generated_bridge.dart \
            client/flutter/lib/generated_bridge.freezed.dart \
            client/flutter/macos/Runner/bridge_generated.h \
            client/flutter/ios/Runner/bridge_generated.h; do
            if [ -f "$f" ]; then
              FILES="$FILES $f"
            else
              echo "::warning::bridge 文件未生成，不打包：$f"
            fi
          done
          if [ -z "$FILES" ]; then
            echo "::error::一个 bridge 文件都没生成 —— flutter_rust_bridge 这一步就没跑通"
            exit 1
          fi
          tar -czf bridge.tar.gz $FILES
          echo "包内内容："
          tar -tzf bridge.tar.gz

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedesk-bridge
          path: bridge.tar.gz
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Windows x64 构建
  # ---------------------------------------------------------------------------
  build-windows:
    name: x86_64-pc-windows-msvc
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.should_build == 'true' }}
    needs: [preflight, generate-bridge]
    runs-on: windows-2022

    # ---- inputs 兜底（本流水线最容易踩的坑，改动前请先读完） --------------
    # `inputs` context 只在 workflow_dispatch 触发时才有值。
    # push 触发时 inputs.hwcodec 是空的，而 `if: ${{ inputs.hwcodec }}` 对空值
    # 判 false —— 于是 input 里写的 default: true 完全不生效。
    #
    # 后果远不止"步骤被跳过"：
    #   1. Verify FFmpeg headers 不跑，缺失不会被发现
    #   2. vcpkg 的 host triplet 退回 x64-windows → FFmpeg 被静默跳过
    #   3. client/build.py 拿不到 --hwcodec → 产物是软件编码版
    #   4. 流水线依然全绿 —— 这是静默降级，比构建失败更难发现
    #
    # 所以在 job 级显式兜底，让非手动触发时按设计意图走。
    #
    # 另一个坑：env 里存的是字符串 "true"/"false"，而 Actions 中非空字符串
    # 一律 truthy（"false" 也是真）。因此下面每处判断都必须写成 == 'true'，
    # 绝不能简写成 if: ${{ env.ENABLE_HWCODEC }}。
    env:
      ENABLE_HWCODEC: ${{ github.event_name != 'workflow_dispatch' || inputs.hwcodec == true }}
      # 末尾的 || github.ref_type == 'tag'：发版时 Release 应该同时提供安装包形态，
      # 而 tag push 的 event_name 是 push，不加这一项 MSI 会被静默跳过。
      BUILD_MSI: ${{ github.event_name == 'workflow_dispatch' && inputs.build_msi == true || github.ref_type == 'tag' }}

    steps:
      # vcpkg 的 x-gha 二进制缓存后端需要这两个运行时变量，
      # 不导出的话 vcpkg 会静默退化成不用缓存，构建时间直接翻倍。
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: wedesk-bridge
          path: .

      # 解包并立刻校验落点。不校验的话，文件落错位置要到几百个依赖全部
      # 编译完才以 E0583 的形式暴露 —— 白等十分钟，且报错指不到真因。
      # build/common/unpack-bridge.sh 里写清了 upload-artifact@v4 的路径
      # 推断为什么会把 client/ 这一层剥掉，改之前请先读那段注释。
      - name: Unpack bridge files
        shell: bash
        run: bash build/common/unpack-bridge.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      # Flutter 3.24.5 的 Windows engine 缺 dropdown enableFilter 需要的接口，
      # 必须换成 RustDesk 自研 engine，否则 flutter build 直接编译失败。
      # 这里用 $(dirname $(dirname $(command -v flutter))) 推导 FLUTTER_ROOT，
      # 而不是写死 C:/hostedtoolcache/... —— 后者一旦 action 换安装路径就 404。
      - name: Replace engine with rustdesk custom flutter engine
        shell: bash
        run: |
          set -e
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_ENV"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_STEP_SUMMARY"
          flutter doctor -v
          flutter precache --windows
          curl -L --fail -o engine.zip \
            https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip
          mkdir -p engine
          unzip -q -o engine.zip -d engine
          mkdir -p "$FLUTTER_ROOT/bin/cache/artifacts/engine/windows-x64-release"
          cp -rf engine/. "$FLUTTER_ROOT/bin/cache/artifacts/engine/windows-x64-release/"
          echo "✓ engine 替换完成"

      # https://github.com/flutter/flutter/issues/155685
      - name: Patch flutter
        shell: bash
        run: |
          set -e
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          if [ "${{ env.FLUTTER_VERSION }}" != "3.24.5" ]; then
            echo "当前 Flutter 非 3.24.5，跳过 dropdown 补丁"
            exit 0
          fi
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT/"
          cd "$FLUTTER_ROOT"
          # 幂等：flutter-action 开了 cache:true 后，热缓存里的 SDK 已含本补丁，
          # 再次 git apply 会报 "already applied" 而失败，故先 --check 探测再决定。
          if git apply --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
            echo "✓ flutter 补丁已应用"
          elif git apply -R --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            echo "✓ flutter 补丁已存在（缓存热命中，跳过）"
          else
            echo "::error::flutter 补丁既无法应用也无法确认已存在"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: wedesk-windows

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      # VCPKG_DEFAULT_HOST_TRIPLET 是这条流水线最容易踩的坑，务必保留：
      # vcpkg.json 里 ffmpeg 声明为 host:true，且 platform 条件是 `... & static`。
      # host triplet 默认取 x64-windows（动态 CRT），不满足 static 条件 ——
      # 结果 FFmpeg 被静默跳过，后面 hwcodec 编 mfx_encode.cpp 时报
      #   fatal error C1083: Cannot open include file: 'libavcodec/avcodec.h'
      # 上游 flutter-build.yml 是靠这个变量让 host 与 target triplet 一致的。
      #
      # 只在 hwcodec 打开时设成 static：不打开时保持默认 x64-windows，
      # vcpkg 就会跳过 FFmpeg（它最慢，源码编译动辄 40 分钟以上），
      # 默认构建因此能快很多。
      - name: Install vcpkg dependencies
        # manifest 在 client/vcpkg.json（客户端整棵树迁进 client/ 之后），
        # 而 vcpkg 只认【当前工作目录】的 vcpkg.json —— 没有这一行它会在仓库根
        # 找不到 manifest，退化成 classic 模式后立刻报错退出，且 buildtrees
        # 一个都不会建，于是下面那段"输出全部 buildtree 日志"的兜底诊断也跟着
        # 报 `find: 'C:\vcpkg/buildtrees': No such file or directory`，
        # 真正的失败原因反被盖住。2026-10-16 CI 连挂三次就是这个。
        working-directory: client
        env:
          # 字符串写死而非引用 env.VCPKG_TRIPLET：step 级 env 里引用 env context
          # 的求值顺序不够可靠，而这里两个值必须严格可预测。
          # 改动时记得与上面的 VCPKG_TRIPLET 保持同步。
          # 用 env.ENABLE_HWCODEC 而非 inputs.hwcodec —— 后者在 push 触发时为空，
          # 会让这里静默退回 x64-windows，FFmpeg 因此被跳过。
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.ENABLE_HWCODEC == 'true' && 'x64-windows-static' || 'x64-windows' }}
        shell: bash
        run: |
          set -e
          echo "工作目录: $PWD"
          ls -l vcpkg.json
          echo "VCPKG_DEFAULT_HOST_TRIPLET=$VCPKG_DEFAULT_HOST_TRIPLET"
          echo "VCPKG_DEFAULT_HOST_TRIPLET=$VCPKG_DEFAULT_HOST_TRIPLET" >> "$GITHUB_STEP_SUMMARY"
          # 整体重试 3 次：vcpkg 自己对单个下载只重试 3 次且无退避，而一整轮
          # 构建里有 aom / libvpx / ffmpeg / mfx-dispatch 等多个 port 各自去
          # GitHub 取源码，只要其中一个撞上瞬时 503 就会整步骤失败
          # （2026-10-20 就是 mfx-dispatch 的补丁链接 503）。
          # 重试的代价可控：已装好的包走 x-gha 二进制缓存，只会重建失败的那个。
          vcpkg_attempt=1
          vcpkg_ok=0
          while [ "$vcpkg_attempt" -le 3 ]; do
            if "$VCPKG_ROOT/vcpkg" install \
                --triplet ${{ env.VCPKG_TRIPLET }} \
                --x-install-root="$VCPKG_ROOT/installed"; then
              vcpkg_ok=1
              break
            fi
            if [ "$vcpkg_attempt" -lt 3 ]; then
              echo "::warning::vcpkg install 第 ${vcpkg_attempt} 次失败，60 秒后重试（GitHub 下载多为瞬时故障）"
              sleep 60
            fi
            vcpkg_attempt=$((vcpkg_attempt + 1))
          done
          if [ "$vcpkg_ok" != "1" ]; then
            echo "===== vcpkg 失败（已重试 3 次），输出全部 buildtree 日志 ====="
            # buildtrees 可能压根没建（manifest 解析就失败时），
            # 所以先探一下再 find，别让兜底诊断自己变成报错的主角。
            if [ -d "$VCPKG_ROOT/buildtrees" ]; then
              find "$VCPKG_ROOT/buildtrees" -name "*.log" | while read -r f; do
                echo "--- $f ---"
                cat "$f"
              done
            else
              echo "($VCPKG_ROOT/buildtrees 不存在 —— vcpkg 在建任何东西之前就失败了，"
              echo " 优先怀疑 manifest 没找到：本步骤的 working-directory 必须是 client/)"
            fi
            exit 1
          fi
          # FFmpeg 是这条链路上最脆弱的一环，即使成功也留一份构建日志备查
          head -n 60 "$VCPKG_ROOT/buildtrees/ffmpeg/build-${{ env.VCPKG_TRIPLET }}-rel-out.log" 2>/dev/null || true

      # 与其让 FFmpeg 缺失以几十条 C1083 的形式暴露在 cargo 日志里，
      # 不如在这里直接说清楚缺什么、为什么会缺。
      - name: Verify FFmpeg headers (hwcodec only)
        # 必须写成 == 'true'：env 里是字符串，"false" 在 Actions 中也是 truthy
        if: ${{ env.ENABLE_HWCODEC == 'true' }}
        shell: bash
        run: |
          set -e
          INC="$VCPKG_ROOT/installed/${{ env.VCPKG_TRIPLET }}/include"
          missing=0
          for h in libavcodec/avcodec.h libavutil/pixfmt.h libavformat/avformat.h; do
            if [ -f "$INC/$h" ]; then
              echo "  [OK]   $h"
            else
              echo "  [MISS] $h"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "::error::FFmpeg 头文件缺失于 $INC —— hwcodec 编译 mfx_encode.cpp 会失败。请确认 client/vcpkg.json 的 ffmpeg 条目的 platform 条件被满足（需要 host triplet 为 static）。"
            ls -la "$VCPKG_ROOT/installed/" || true
            exit 1
          fi
          echo "✓ FFmpeg 头文件就位"

      # ------------------------------------------------------------------
      # 品牌注入：唯一真源是 build/client/custom.toml。
      # 脚本幂等 —— 源码已是目标值时什么都不会做，所以重复构建不会有脏 diff。
      # 需要临时换品牌时，在 Actions 页面手填 inputs，或在仓库 Settings 里配
      # variables.WEDESK_COMPANY / WEDESK_WEBSITE，无需改源码。
      # ------------------------------------------------------------------
      - name: Apply brand customization
        if: ${{ inputs.skip_customize != true }}
        shell: bash
        run: |
          set -e
          EXTRA=()
          COMPANY="${{ inputs.company_name }}"
          SITE="${{ inputs.website }}"
          [ -n "$COMPANY" ] && EXTRA+=(--set "brand.company_name=$COMPANY")
          [ -n "$SITE" ]    && EXTRA+=(--set "brand.website=$SITE")
          python build/client/customize.py --source client --config build/client/custom.toml "${EXTRA[@]}"

      # ------------------------------------------------------------------
      # 主构建。
      #
      # 为什么不直接 `python build.py` —— 2026-10-17 连挂两次的直接原因：
      #   build.py 内部每条子命令都用 os.system() 包着，任何一步失败都只是
      #   sys.exit(-1)；而 sys.exit(-1) 在 Git Bash 里映射到退出码 **127**，
      #   与"命令不存在"完全无法区分。于是这个步骤在日志里只剩 runner 那句
      #   "Process completed with exit code 127"：既看不出是 cargo 挂的还是
      #   flutter 挂的，也看不出挂在哪一行，更别说失败原因。
      #   拆成两步后，失败步骤名本身就是定位信息；再加上
      #   emit_error_lines 把关键错误行抛进 Annotations，一次运行就能看清。
      #
      #   features 用 build.py --print-features 取，不硬写 flutter,hwcodec：
      #   这是上游专门留给"自己跑 cargo 的调用方"的开关（见 build.py 注释）。
      #   硬写等于和上游脚本绑死 —— 上游改一次参数与 feature 的对应关系，
      #   这边就会编出和 build.py 不一致的东西，而且不会有任何提示。
      # ------------------------------------------------------------------
      - name: Build Rust core (librustdesk.dll)
        shell: bash
        run: |
          set -eo pipefail
          source build/common/emit-error-lines.sh
          HWCODEC="${{ env.ENABLE_HWCODEC == 'true' && '--hwcodec' || '' }}"
          echo "硬件编解码: ${HWCODEC:-关闭}"
          echo "硬件编解码: ${HWCODEC:-关闭}" >> "$GITHUB_STEP_SUMMARY"
          FEATURES="$(cd client && python build.py --flutter --portable $HWCODEC ${{ inputs.build_args }} --print-features)"
          echo "cargo features: ${FEATURES}"
          echo "cargo features: \`${FEATURES}\`" >> "$GITHUB_STEP_SUMMARY"
          LOG="$RUNNER_TEMP/rust-build.log"

          # 虚拟显示驱动的 dll：flutter 产物目录里必须带着它，
          # build.py 是在 flutter build 之后才拷的，这里先把库编出来。
          if ! (cd client/libs/virtual_display/dylib && cargo build --locked --release) 2>&1 | tee "$LOG"; then
            echo "::error::cargo build 失败（libs/virtual_display/dylib）—— 关键行见 Annotations"
            emit_error_lines "$LOG" dylib
            exit 1
          fi

          if ! (cd client && cargo build --locked --features "$FEATURES" --lib --release) 2>&1 | tee "$LOG"; then
            echo "::error::cargo build 失败（librustdesk，features=${FEATURES}）—— 关键行见 Annotations"
            emit_error_lines "$LOG" cargo
            exit 1
          fi

          # build.py 自己也是这么判的：cargo 退出 0 但 dll 不在，后面 flutter
          # 的 CMake install 一样会失败，而那时报的是
          # "file INSTALL cannot find ... librustdesk.dll"，离真因又远一层。
          if [ ! -f client/target/release/librustdesk.dll ]; then
            echo "::error::cargo 退出码为 0，但 client/target/release/librustdesk.dll 不存在"
            ls -l client/target/release/ | head -n 20
            exit 1
          fi
          echo "✓ librustdesk.dll 就位"
          ls -l client/target/release/librustdesk.dll

      - name: Build Flutter (windows x64)
        shell: bash
        run: |
          set -eo pipefail
          source build/common/emit-error-lines.sh
          LOG="$RUNNER_TEMP/flutter-build.log"
          # 必须在 client/flutter 里跑：flutter 靠向上查找 pubspec.yaml 定位工程根。
          # 从别处调用会拿到错误的工程根，报的错跟真正的问题毫无关系。
          if ! (cd client/flutter && flutter build windows --release) 2>&1 | tee "$LOG"; then
            echo "::error::flutter build windows 失败 —— 关键行见 Annotations"
            emit_error_lines "$LOG" flutter
            exit 1
          fi
          # build.py 在 flutter build 之后做的这一步：驱动 dll 要和 exe 放一起
          cp -f client/target/release/deps/dylib_virtual_display.dll \
                client/flutter/build/windows/x64/runner/Release/
          mkdir -p rustdesk
          cp -rf client/flutter/build/windows/x64/runner/Release/. ./rustdesk/
          ls -l ./rustdesk

      - name: Bundle usbmmidd (virtual monitor driver)
        shell: bash
        run: |
          set -e
          curl -L --fail -o usbmmidd_v2.zip \
            https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip -q -o usbmmidd_v2.zip -d usbmmidd_v2
          rm -rf usbmmidd_v2/Win32 usbmmidd_v2/deviceinstaller64.exe \
                 usbmmidd_v2/deviceinstaller.exe usbmmidd_v2/usbmmidd.bat
          cp -rf usbmmidd_v2 ./rustdesk/

      # 打印机驱动属于可选增强，下载/校验失败不应让整个构建变红
      - name: Bundle printer driver (optional)
        continue-on-error: true
        shell: bash
        run: |
          set -e
          BASE=https://github.com/rustdesk/hbb_common/releases/download/driver
          curl -L --fail -o driver.zip    "$BASE/rustdesk_printer_driver_v4-1.4.zip"
          curl -L --fail -o adapter.zip   "$BASE/printer_driver_adapter.zip"
          curl -L --fail -o sha256sums    "$BASE/sha256sums"
          sum_driver=$(awk '$2=="*rustdesk_printer_driver_v4-1.4.zip"{print $1}' sha256sums)
          sum_adapter=$(awk '$2=="*printer_driver_adapter.zip"{print $1}' sha256sums)
          [ "$(sha256sum driver.zip  | cut -d' ' -f1)" = "$sum_driver" ] || exit 1
          [ "$(sha256sum adapter.zip | cut -d' ' -f1)" = "$sum_adapter" ] || exit 1
          unzip -q -o driver.zip -d rustdesk_printer_driver_v4-1.4
          unzip -q -o adapter.zip -d printer_driver_adapter
          mkdir -p ./rustdesk/drivers
          cp -rf rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
          cp -f printer_driver_adapter/printer_driver_adapter.dll ./rustdesk/
          echo "✓ 打印机驱动已打包"

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: wedesk-windows-x64
          path: rustdesk
          retention-days: 14

      - name: Build MSI installer (optional)
        if: ${{ env.BUILD_MSI == 'true' }}
        continue-on-error: true
        shell: pwsh
        run: |
          Push-Location client/res/msi
          # --app-name 必须与便携版里的 exe 名一致（windows/CMakeLists.txt 的
          # BINARY_NAME，即 custom.toml 的 exe_name）。WiX 的 File 元素按
          # "$(var.Product).exe" 引用主程序，对不上会直接打包失败。
          python preprocess.py --arp --app-name wedesk -d ../../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          Pop-Location
          New-Item -ItemType Directory -Force -Path ./msi-out | Out-Null
          Move-Item $msi.FullName ./msi-out/wedesk-x64.msi -Force

      - name: Upload MSI
        if: ${{ env.BUILD_MSI == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wedesk-windows-x64-msi
          path: ./msi-out
          retention-days: 14

      # 把"这次到底产出了什么"摊开写进摘要。
      # 上面修过的静默降级说明了一件事：流水线可能全绿，但产物不是想要的
      # —— hwcodec 关着、MSI 没构建，而日志里查不到任何失败。
      # 所以这里把关键开关和产物清单一并列出，扫一眼就能确认，
      # 不用去翻几千行日志找 --hwcodec 到底传没传。
      - name: Build summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Wedesk Windows 构建结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 触发方式 | \`${{ github.event_name }}\` |"
            echo "| 硬件编解码 hwcodec | ${{ env.ENABLE_HWCODEC }} |"
            echo "| MSI 安装包 | ${{ env.BUILD_MSI }} |"
            echo "| vcpkg host triplet | \`${{ env.ENABLE_HWCODEC == 'true' && 'x64-windows-static' || 'x64-windows' }}\` |"
            echo ""
            echo "### 产物 —— 在本页底部 Artifacts 区域，保留 14 天"
            echo ""
            echo "- **wedesk-windows-x64** — 便携版，解压即可运行"
            if [ "${{ env.BUILD_MSI }}" = "true" ]; then
              echo "- **wedesk-windows-x64-msi** — MSI 安装包"
            else
              echo "- MSI 未构建（本次未启用 build_msi）"
            fi
            echo ""
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo ""
              echo "> 本次是标签构建，稍后 release job 会把上述产物发布为 GitHub Release。"
            else
              echo ""
              echo "> 产物是 Actions Artifact（保留 14 天）。"
              echo "> 需要长期保存、带版本号的可分发包，请推送 \`v*\` 标签触发 Release。"
            fi
            echo ""
            echo "若上表 hwcodec 为 false 却期望开启，检查是否手动触发时取消了勾选。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. Android —— 先按 ABI 编 Rust 核心库（librustdesk.so）
  #
  #    为什么要拆成「编 .so」与「打 APK」两个 job：
  #    Gradle/AGP 跑一次要十分钟以上，三个 ABI 各跑一遍就是半小时纯重复。
  #    .so 与 ABI 绑定、APK 组装与 ABI 无关 —— 把 3 份 .so 先作为 artifact
  #    汇总，再只跑一次 Gradle，就能同时拿到按 ABI 分包的 APK 与 AAB。
  #
  #    与上游 rustdesk CI 的差异（改动前请先读）：
  #      - 客户端整棵树在 client/ 下，cargo 必须在 client/ 里执行：
  #        vcpkg.json 在 client/，cargo 只在当前目录认 manifest。
  #      - build_android_deps.sh 内部会 pushd 到脚本的上一级目录（正好是
  #        client/），所以从仓库根直接调用即可，不需要先 cd。
  #      - 品牌注入必须在【编 .so 之前】完成：内置服务器地址写在
  #        libs/hbb_common/src/config.rs 里，会被编译进 .so，后补无效。
  # ---------------------------------------------------------------------------
  build-android:
    name: android ${{ matrix.job.abi }}
    # inputs.build_android 只在 workflow_dispatch 时有值；push/tag 时为空，
    # 所以要在前半段先排除 workflow_dispatch，否则空值会让整个 job 被跳过。
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_android == true) }}
    needs: [preflight, generate-bridge]
    runs-on: ubuntu-22.04
    strategy:
      # 单个 ABI 失败不应连坐：armeabi-v7a 的 vcpkg（ffmpeg/aom）是最容易
      # 在工具链升级后挂掉的一环，而 arm64 才是绝大多数真机要用的。
      fail-fast: false
      matrix:
        job:
          - { abi: arm64-v8a,   target: aarch64-linux-android,   ndk-script: ndk_arm64.sh }
          - { abi: armeabi-v7a, target: armv7-linux-androideabi, ndk-script: ndk_arm.sh }
          - { abi: x86_64,      target: x86_64-linux-android,    ndk-script: ndk_x64.sh }

    steps:
      # vcpkg 要为三个 ABI 各编一遍 ffmpeg/aom/libvpx，磁盘压力最大的一环。
      # android: false / tool-cache: false —— 这两个删了就得重下 SDK 与工具链。
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # 上游 flutter-build.yml 的 build-rustdesk-android 有这一步，我们之前没有 ——
      # 这是安卓 job 与上游最实质的差异之一。runner 镜像自带 cmake / ninja /
      # pkg-config / autoconf / libtool（见 runner-images 的 Ubuntu2204-Readme），
      # 但**不带 nasm / yasm**：aom、libvpx、ffmpeg 这三个 port 的 x86 汇编都
      # 要用它。vcpkg 的 vcpkg_find_acquire_program(NASM) 理论上会自己下载，
      # 但那只在 Linux 上下载受限版本， overlay port 里的 ffmpeg 还打了
      # 0005-fix-nasm.patch —— 与其赌它能自愈，不如按上游把包装上。
      # g++-multilib / gcc-multilib 是给 x86 ABI 的 host 侧 32 位编译准备的。
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               unzip \
               wget \
               zip
          nasm -v || echo "::warning::nasm 仍未装上"

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Linux 的 runner 只有 python3，没有 `python` 这个别名 ——
      # 品牌注入脚本是用 `python` 调的，少了这一步会直接 "command not found"。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # AGP 8.x 要求 JDK 17。用 setup-java 而不是 apt + 猜路径：
      # 后者写死 /usr/lib/jvm/java-17-openjdk-amd64，换 runner 镜像就 404。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Patch flutter
        shell: bash
        run: |
          set -e
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          if [ "${{ env.FLUTTER_VERSION }}" != "3.24.5" ]; then
            echo "当前 Flutter 非 3.24.5，跳过 dropdown 补丁"
            exit 0
          fi
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT/"
          cd "$FLUTTER_ROOT"
          # 幂等：flutter-action 开了 cache:true 后，热缓存里的 SDK 已含本补丁，
          # 再次 git apply 会报 "already applied" 而失败，故先 --check 探测再决定。
          if git apply --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
            echo "✓ flutter 补丁已应用"
          elif git apply -R --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            echo "✓ flutter 补丁已存在（缓存热命中，跳过）"
          else
            echo "::error::flutter 补丁既无法应用也无法确认已存在"
            exit 1
          fi

      - name: 接受 Android SDK 许可
        # 不接受许可时 gradle 会以 "Failed to install the following SDK components"
        # 收场，且报错里不提 license 二字，是典型的难查失败。
        run: yes | flutter doctor --android-licenses || echo "（部分许可未接受，继续尝试构建）"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (android)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -eo pipefail
          source build/common/emit-error-lines.sh
          ABI="${{ matrix.job.abi }}"
          LOG="$RUNNER_TEMP/vcpkg-android-$ABI.log"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          # 这两个变量任一个为空，build_android_deps.sh 都会立刻 exit 1，
          # 但它的报错只是一句 "Please set XXX"，看不出是 setup-ndk 的输出
          # 没接上还是 run-vcpkg 没导出 —— 在这里先点名，省掉一轮排查。
          [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ] \
            || echo "::error::[vcpkg:android/$ABI] ANDROID_NDK_HOME='$ANDROID_NDK_HOME' 无效（setup-ndk 的 ndk-path 没接上）"
          [ -n "$VCPKG_ROOT" ] && [ -d "$VCPKG_ROOT" ] \
            || echo "::error::[vcpkg:android/$ABI] VCPKG_ROOT='$VCPKG_ROOT' 无效（run-vcpkg 没导出）"
          ls "$ANDROID_NDK_HOME" 2>&1 | head -5
          # vcpkg 可执行文件本身就位：run-vcpkg 会 bootstrap，但换过
          # vcpkgDirectory 或缓存命中异常时它可能不在。缺了它脚本只会以 126
          # 退出，日志里一句 "Permission denied"/"No such file"，没有 error
          # 字样 —— 挑错误行的诊断会一条都挑不出来（踩过）。
          [ -x "$VCPKG_ROOT/vcpkg" ] \
            || echo "::error::[vcpkg:android/$ABI] $VCPKG_ROOT/vcpkg 不存在或不可执行"
          ls -la "$VCPKG_ROOT" 2>&1 | head -10
          # bash 调用而不是 ./xxx.sh：脚本的可执行位在 Windows 上会被
          # core.filemode=false 静默丢掉，用 bash 调用与权限位无关。
          if ! bash ./client/flutter/build_android_deps.sh "$ABI" 2>&1 | tee "$LOG"; then
            echo "::error::[vcpkg:android/$ABI] install 失败。剩余磁盘：$(df -h "$RUNNER_TEMP" 2>/dev/null | tail -1 | tr -s ' ')"
            emit_error_lines "$LOG" "vcpkg:android/$ABI" 20
            # 整段搬尾部必须无条件做：挑行只在日志里有 error/failed 字样时
            # 有用，而 "Permission denied" 这类失败一个字都挑不出来 ——
            # 那一轮就是靠"什么都没挑出来"反推出脚本根本没跑起来的。
            emit_log_tail "$LOG" "vcpkg:android/$ABI-tail" 30
            emit_summary_tail "$LOG" "vcpkg(android/$ABI) 失败 —— 日志尾部" 80
            # 主 stdout 里通常只剩一句 "Building package xxx failed"，
            # 真因在 buildtrees 下的 port 日志里 —— 按修改时间取最近 3 个。
            if [ -d "$VCPKG_ROOT/buildtrees" ]; then
              find "$VCPKG_ROOT/buildtrees" -name "*.log" -printf "%T@ %p\n" \
                | sort -rn | head -3 | cut -d' ' -f2- | while read -r f; do
                    emit_log_tail "$f" "$(basename "$f")" 25
                  done
            else
              echo "::error::[vcpkg:android/$ABI] $VCPKG_ROOT/buildtrees 不存在 —— vcpkg 在建任何东西之前就失败了，优先怀疑 manifest 没找到或 triplet 缺失。"
            fi
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: wedesk-bridge
          path: .

      # 解包并立刻校验落点。不校验的话，文件落错位置要到几百个依赖全部
      # 编译完才以 E0583 的形式暴露 —— 白等十分钟，且报错指不到真因。
      # build/common/unpack-bridge.sh 里写清了 upload-artifact@v4 的路径
      # 推断为什么会把 client/ 这一层剥掉，改之前请先读那段注释。
      - name: Unpack bridge files
        shell: bash
        run: bash build/common/unpack-bridge.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: wedesk-android
          key: ${{ matrix.job.target }}

      - name: Apply brand customization
        if: ${{ inputs.skip_customize != true }}
        run: python build/client/customize.py --source client --config build/client/custom.toml

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -eo pipefail
          source build/common/emit-error-lines.sh
          ABI="${{ matrix.job.abi }}"
          LOG="$RUNNER_TEMP/ndk-$ABI.log"
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          # 必须在 client/ 里跑：ndk_*.sh 里的 cargo 需要本目录的 Cargo.toml。
          # 产物因此落在 client/target/<triple>/release/ —— 不是仓库根的 target/。
          # bash 调用而非 ./xxx.sh：见 preflight 里"shell 脚本可执行位"那条说明。
          if ! (cd client && bash ./flutter/${{ matrix.job.ndk-script }}) 2>&1 | tee "$LOG"; then
            emit_error_lines "$LOG" "cargo-ndk:$ABI" 20
            emit_log_tail "$LOG" "cargo-ndk:$ABI-tail" 30
            exit 1
          fi
          # 显式校验 .so 真的生成了：cargo 退出 0 但产物不在，后面的 Gradle
          # 只会报 "file not found"，离真因又远一层。
          SO="client/target/${{ matrix.job.target }}/release/liblibrustdesk.so"
          [ -f "$SO" ] || { echo "::error::[cargo-ndk:$ABI] 编译退出 0 但 $SO 不存在"; emit_log_tail "$LOG" "cargo-ndk:$ABI-tail" 30; exit 1; }
          mkdir -p "client/flutter/android/app/src/main/jniLibs/${ABI}"
          cp "$SO" "client/flutter/android/app/src/main/jniLibs/${ABI}/librustdesk.so"
          ls -lh "client/flutter/android/app/src/main/jniLibs/${ABI}/librustdesk.so"

      - name: Upload librustdesk.so
        uses: actions/upload-artifact@v4
        with:
          name: librustdesk.so.${{ matrix.job.abi }}
          path: client/flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/librustdesk.so
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3b. Android —— 汇总三个 .so，跑一次 Gradle 产出分包 APK 与 AAB
  #
  #    只跑一次 Gradle 是这里最大的收益；另外下载 .so 全部用 continue-on-error，
  #    某个 ABI 编挂了不影响把其余 ABI 的包发出去 —— 缺哪个 ABI 会写进摘要，
  #    不会静默产出一个装不上的包。
  #
  #    产物刻意【不做 fat 通用包】：三个 ABI 全塞进一个 APK 体积上百 MB，
  #    而 Google Play 用 AAB、侧载用按 ABI 分包，fat 包两头都不划算。
  # ---------------------------------------------------------------------------
  build-android-apk:
    name: android apk/aab
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_android == true) && !cancelled() && needs.build-android.result != 'skipped' }}
    needs: [preflight, generate-bridge, build-android]
    runs-on: ubuntu-22.04
    env:
      # 真实值由下面的 Build APK 步骤写进 GITHUB_ENV（取自 client/Cargo.toml）。
      # 这里先声明为空串，是为了让 build/common/check-workflow.py 能解析到
      # 摘要步骤里的 ${{ env.VERSION }} —— 否则它会被判成"引用了不存在的变量"。
      VERSION: ""

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Patch flutter
        shell: bash
        run: |
          set -e
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          if [ "${{ env.FLUTTER_VERSION }}" != "3.24.5" ]; then
            exit 0
          fi
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT/"
          cd "$FLUTTER_ROOT"
          # 幂等：flutter-action 开了 cache:true 后，热缓存里的 SDK 已含本补丁，
          # 再次 git apply 会报 "already applied" 而失败，故先 --check 探测再决定。
          # （上一轮这个 job 的 Patch flutter 就是漏了这层判断，热缓存命中即挂。）
          if git apply --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
            echo "✓ flutter 补丁已应用"
          elif git apply -R --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            echo "✓ flutter 补丁已存在（缓存热命中，跳过）"
          else
            echo "::error::flutter 补丁既无法应用也无法确认已存在"
            exit 1
          fi

      - name: 接受 Android SDK 许可
        run: yes | flutter doctor --android-licenses || echo "（部分许可未接受，继续尝试构建）"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: wedesk-bridge
          path: .

      # 解包并立刻校验落点。不校验的话，文件落错位置要到几百个依赖全部
      # 编译完才以 E0583 的形式暴露 —— 白等十分钟，且报错指不到真因。
      # build/common/unpack-bridge.sh 里写清了 upload-artifact@v4 的路径
      # 推断为什么会把 client/ 这一层剥掉，改之前请先读那段注释。
      - name: Unpack bridge files
        shell: bash
        run: bash build/common/unpack-bridge.sh

      # 三个 .so 各自下载、各自允许失败：缺哪个 ABI 后面就只打剩下的，
      # 而不是整个 job 红掉连 arm64 都拿不到。
      - name: Download librustdesk.so (arm64-v8a)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: librustdesk.so.arm64-v8a
          path: client/flutter/android/app/src/main/jniLibs/arm64-v8a

      - name: Download librustdesk.so (armeabi-v7a)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: librustdesk.so.armeabi-v7a
          path: client/flutter/android/app/src/main/jniLibs/armeabi-v7a

      - name: Download librustdesk.so (x86_64)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: librustdesk.so.x86_64
          path: client/flutter/android/app/src/main/jniLibs/x86_64

      - name: Apply brand customization
        if: ${{ inputs.skip_customize != true }}
        run: python build/client/customize.py --source client --config build/client/custom.toml

      # gradlew / gradlew.bat / gradle-wrapper.jar 全被 android/.gitignore 排除
      # （上游 rustdesk 同样如此），但 flutter build apk 要调 ./gradlew。
      # 本机它们由 Android Studio 生成，CI 里没有 —— 用镜像自带的 gradle
      # 生成一份，版本取自仓库里的 gradle-wrapper.properties（8.11.1），
      # 避免与工程预期不一致。
      #
      # 为什么在空目录里生成再拷过去：直接 (cd android && gradle wrapper)
      # 会先 configure 整个 Android 工程，而它的 settings.gradle 依赖 flutter
      # SDK 注入的本地属性，configure 大概率失败 —— 在空目录里跑就没有项目可配置。
      - name: 确保 Gradle Wrapper 就位
        shell: bash
        run: |
          set -e
          AND=client/flutter/android
          if [ -x "$AND/gradlew" ]; then echo "✓ gradlew 已存在"; exit 0; fi
          GV="$(sed -n 's/^distributionUrl=.*gradle-\([0-9.]*\)-.*/\1/p' \
                "$AND/gradle/wrapper/gradle-wrapper.properties" | head -1)"
          if [ -z "$GV" ] || ! command -v gradle >/dev/null 2>&1; then
            echo "::warning::无法生成 gradlew（版本解析为空或 gradle 不在 PATH），继续尝试 —— 让 flutter 自己找 gradle"
            exit 0
          fi
          echo "生成 gradle wrapper $GV"
          TMP="$(mktemp -d)"
          (cd "$TMP" && gradle wrapper --gradle-version "$GV" --distribution-type all) \
            || { echo "::warning::gradle wrapper 生成失败，继续尝试"; exit 0; }
          cp "$TMP/gradlew" "$AND/gradlew"
          [ -f "$TMP/gradlew.bat" ] && cp "$TMP/gradlew.bat" "$AND/gradlew.bat"
          mkdir -p "$AND/gradle/wrapper"
          cp "$TMP/gradle/wrapper/gradle-wrapper.jar" "$AND/gradle/wrapper/"
          # 仓库里那份 properties 版本就是 GV，不要覆盖
          chmod +x "$AND/gradlew"
          ls -l "$AND/gradlew" "$AND/gradle/wrapper/gradle-wrapper.jar"

      - name: Build APK (split per ABI) and AAB
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -eo pipefail
          source build/common/emit-error-lines.sh
          LOG="$RUNNER_TEMP/flutter-android.log"
          JNI=client/flutter/android/app/src/main/jniLibs
          # 实际拿到了哪些 .so，就只编哪些 ABI —— 避免产出"装得上但一运行就
          # 报找不到 librustdesk.so"的包，这种问题只能等用户在手机上发现。
          PLATFORMS=""
          [ -f "$JNI/arm64-v8a/librustdesk.so" ]   && PLATFORMS="$PLATFORMS,android-arm64"
          [ -f "$JNI/armeabi-v7a/librustdesk.so" ] && PLATFORMS="$PLATFORMS,android-arm"
          [ -f "$JNI/x86_64/librustdesk.so" ]      && PLATFORMS="$PLATFORMS,android-x64"
          PLATFORMS="${PLATFORMS#,}"
          if [ -z "$PLATFORMS" ]; then
            echo "::error::三个 ABI 的 librustdesk.so 一个都没拿到，无法打包"
            exit 1
          fi
          echo "target-platform = $PLATFORMS"
          echo "target-platform = $PLATFORMS" >> "$GITHUB_STEP_SUMMARY"

          # libc++_shared.so 是 librustdesk.so 的运行时依赖，缺了会在启动时
          # 直接崩，且崩溃日志里只写 dlopen 失败 —— 从 NDK 的 sysroot 补齐。
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          [ -f "$JNI/arm64-v8a/librustdesk.so" ]   && cp "$SYSROOT/aarch64-linux-android/libc++_shared.so"   "$JNI/arm64-v8a/"
          [ -f "$JNI/armeabi-v7a/librustdesk.so" ] && cp "$SYSROOT/arm-linux-androideabi/libc++_shared.so"   "$JNI/armeabi-v7a/"
          [ -f "$JNI/x86_64/librustdesk.so" ]      && cp "$SYSROOT/x86_64-linux-android/libc++_shared.so"    "$JNI/x86_64/"

          # CI 上 Gradle 默认 1 GB 堆不够，AGP 会在 dexing 阶段 OOM
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" client/flutter/android/gradle.properties
          # 没有正式签名密钥，退回 debug 签名：包能装能跑，但不能用以上架。
          # 正式分发请用本地 apksigner 重签，或配 ANDROID_SIGNING_KEY 等 secrets。
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" client/flutter/android/app/build.gradle

          V="$(grep -m1 -E '^version = ' client/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          mkdir -p android-out

          # 用子 shell 而不是 pushd/popd：这条命令失败时 set -e 会直接结束
          # 步骤，后面的诊断代码一行都跑不到 —— 只剩一句 exit code 1。
          if ! (cd client/flutter && flutter build apk --release --split-per-abi --target-platform "$PLATFORMS") 2>&1 | tee "$LOG"; then
            emit_error_lines "$LOG" "flutter:apk" 20
            emit_log_tail "$LOG" "flutter:apk-tail" 30
            exit 1
          fi
          if ! (cd client/flutter && flutter build appbundle --release --target-platform "$PLATFORMS") 2>&1 | tee "$LOG"; then
            emit_error_lines "$LOG" "flutter:aab" 20
            emit_log_tail "$LOG" "flutter:aab-tail" 30
            exit 1
          fi

          APKDIR=client/flutter/build/app/outputs/flutter-apk
          [ -f "$APKDIR/app-arm64-v8a-release.apk" ]   && cp "$APKDIR/app-arm64-v8a-release.apk"   "android-out/wedesk-$V-android-arm64-v8a.apk"
          [ -f "$APKDIR/app-armeabi-v7a-release.apk" ] && cp "$APKDIR/app-armeabi-v7a-release.apk" "android-out/wedesk-$V-android-armeabi-v7a.apk"
          [ -f "$APKDIR/app-x86_64-release.apk" ]      && cp "$APKDIR/app-x86_64-release.apk"      "android-out/wedesk-$V-android-x86_64.apk"
          cp client/flutter/build/app/outputs/bundle/release/app-release.aab "android-out/wedesk-$V-android.aab"
          ls -lh android-out

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wedesk-android
          path: android-out
          retention-days: 14

      - name: Build summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Wedesk Android 构建结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`${{ env.VERSION }}\` |"
            echo "| 签名 | debug（非正式签名，不能直接上架） |"
            echo ""
            echo "产物在本页底部 Artifacts 的 **wedesk-android**，保留 14 天："
            echo "按 ABI 分包的 APK（侧载安装）+ 一个 AAB（上传 Google Play）。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4. iOS —— 未签名 IPA
  #
  #    为什么是"未签名"：签名需要 Apple 开发者账号的证书与描述文件，
  #    那属于仓库 secrets，且绑定的 Bundle ID 与团队 ID 因人而异。
  #    工程里现在还留着上游的 DEVELOPMENT_TEAM（HZF9JMC8YN），
  #    用它签名必然失败，所以统一走 --no-codesign。
  #
  #    未签名 IPA 的用途：交给有证书的人用 `codesign`/`xcrun` 重签后分发，
  #    或用于企业内部分发渠道二次签名。真机直接安装是装不上的。
  # ---------------------------------------------------------------------------
  build-ios:
    name: ios (unsigned ipa)
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_ios == true) }}
    needs: [preflight, generate-bridge]
    # macos-latest 现在是 arm64，正好对应 aarch64-apple-ios 目标
    runs-on: macos-latest

    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # vcpkg 编 arm64-ios 的 ffmpeg/aom 需要这两个汇编器
      - name: Install dependencies
        run: brew install nasm yasm

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Patch flutter
        shell: bash
        run: |
          set -e
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          if [ "${{ env.FLUTTER_VERSION }}" != "3.24.5" ]; then
            echo "当前 Flutter 非 3.24.5，跳过 dropdown 补丁"
            exit 0
          fi
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT/"
          cd "$FLUTTER_ROOT"
          # 幂等：flutter-action 开了 cache:true 后，热缓存里的 SDK 已含本补丁，
          # 再次 git apply 会报 "already applied" 而失败，故先 --check 探测再决定。
          if git apply --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
            echo "✓ flutter 补丁已应用"
          elif git apply -R --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            echo "✓ flutter 补丁已存在（缓存热命中，跳过）"
          else
            echo "::error::flutter 补丁既无法应用也无法确认已存在"
            exit 1
          fi

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (ios)
        # working-directory 必须是 client/：vcpkg 只认当前目录的 vcpkg.json
        working-directory: client
        shell: bash
        run: |
          set -e
          if ! "$VCPKG_ROOT/vcpkg" install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do
              echo "--- $f ---"; cat "$f"
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: wedesk-bridge
          path: .

      # 解包并立刻校验落点。不校验的话，文件落错位置要到几百个依赖全部
      # 编译完才以 E0583 的形式暴露 —— 白等十分钟，且报错指不到真因。
      # build/common/unpack-bridge.sh 里写清了 upload-artifact@v4 的路径
      # 推断为什么会把 client/ 这一层剥掉，改之前请先读那段注释。
      - name: Unpack bridge files
        shell: bash
        run: bash build/common/unpack-bridge.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: wedesk-ios
          key: aarch64-apple-ios

      - name: Apply brand customization
        if: ${{ inputs.skip_customize != true }}
        run: python build/client/customize.py --source client --config build/client/custom.toml

      - name: Build rustdesk lib (ios)
        shell: bash
        run: |
          set -e
          # 与上游 flutter/ios_arm64.sh 一致：iOS 端带 hwcodec 特性
          (cd client && cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib)
          ls -lh client/target/aarch64-apple-ios/release/liblibrustdesk.a

      # 单独一步而不是让 build ipa 顺带跑：pub 解析失败（git 依赖拉不下来、
      # pubspec.lock 与 SDK 版本冲突）会混在几百行 xcodebuild 输出里，
      # 单独跑就能在步骤名上一眼看出是"依赖没拿到"还是"Xcode 编不过"。
      - name: Flutter pub get (ios)
        shell: bash
        run: |
          set -eo pipefail
          source build/common/emit-error-lines.sh
          LOG="$RUNNER_TEMP/flutter-pub-get-ios.log"
          if ! (cd client/flutter && flutter pub get) 2>&1 | tee "$LOG"; then
            emit_error_lines "$LOG" "flutter:pub-get-ios" 20
            emit_log_tail "$LOG" "flutter:pub-get-ios-tail" 30
            exit 1
          fi

      - name: Build IPA
        shell: bash
        run: |
          set -eo pipefail
          source build/common/emit-error-lines.sh
          LOG="$RUNNER_TEMP/flutter-build-ipa.log"
          if ! (cd client/flutter && flutter build ipa --release --no-codesign) 2>&1 | tee "$LOG"; then
            # xcodebuild 的真因常常被几百行 pod 编译日志埋掉：
            # 先挑"像报错"的行，再把尾部整段搬出来看上下文。
            emit_error_lines "$LOG" "flutter:ipa" 15
            emit_log_tail "$LOG" "flutter:ipa-tail" 30
            # 写进 Job Summary：注解有可能被 GitHub 吞掉（踩过一次，整个 job
            # 的自定义注解一条都没落地），而摘要是 job 页面首屏，一定看得到。
            emit_summary_tail "$LOG" "Build IPA 失败 —— 日志尾部" 80
            echo "::error::[flutter:ipa] Xcode 版本：$(xcodebuild -version 2>/dev/null | tr '\n' ' ')"
            {
              echo ""
              echo "Xcode 版本：$(xcodebuild -version 2>/dev/null | tr '\n' ' ')"
              echo ""
              echo "Flutter 版本：$(flutter --version 2>/dev/null | head -1)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # flutter build ipa --no-codesign 不会生成 IPA（日志末尾明确打印
          # "Codesigning disabled with --no-codesign, skipping IPA."），只产出
          # .xcarchive。需要手动把里面的 .app 打成【未签名 IPA】——
          # IPA 本质就是 Payload/<app>.app 的 zip；未签名版本可由后续持有证书
          # 的一方用 xcodebuild -exportArchive 或第三方工具重签后再真机安装/上架。
          ARCHIVE="client/flutter/build/ios/archive/Runner.xcarchive"
          APP="$ARCHIVE/Products/Applications/Runner.app"
          IPA_DIR="client/flutter/build/ios/ipa"
          if [ ! -d "$APP" ]; then
            echo "::error::[flutter:ipa] xcarchive 内找不到 $APP，archive 结构异常"
            emit_log_tail "$LOG" "flutter:ipa-tail" 30
            exit 1
          fi
          rm -rf "$IPA_DIR/Payload"
          mkdir -p "$IPA_DIR/Payload"
          # -R 在 macOS 上会保留 .app 内的符号链接（Frameworks 等），不能用 cp -r
          cp -R "$APP" "$IPA_DIR/Payload/Runner.app"
          ( cd "$IPA_DIR" && zip -r -q "wedesk-ios-unsigned.ipa" Payload )
          ls -lh "$IPA_DIR"/*.ipa

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wedesk-ios
          path: client/flutter/build/ios/ipa/*.ipa
          retention-days: 14

      - name: Build summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Wedesk iOS 构建结果"
            echo ""
            echo "产物在本页底部 Artifacts 的 **wedesk-ios**，保留 14 天。"
            echo ""
            echo "> **未签名**：无 Apple 开发者证书，需由具备证书的一方重签后才能真机安装或上架。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5a. macOS 桌面客户端（Apple 电脑）
  #
  #   走 Flutter 桌面通道：cargo build 产出 liblibrustdesk.dylib，macos/Runner
  #   的 xcworkspace 直接引用 ../../target/release/liblibrustdesk.dylib，无需手动
  #   拷贝；再 flutter build macos --release 编出 .app。service 助手进程需塞进
  #   .app（与上游 build_flutter_dmg 一致）。
  #   v1 先关 hwcodec（纯软编），避开 vcpkg/FFmpeg 在 macOS 的链接坑；
  #   rustdesk/engine 的 main 发布只有 windows 版，macOS 用官方 engine。
  # ---------------------------------------------------------------------------
  build-macos:
    name: macos (desktop app)
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_macos == true) }}
    needs: [preflight, generate-bridge]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Patch flutter
        shell: bash
        run: |
          set -e
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          if [ "${{ env.FLUTTER_VERSION }}" != "3.24.5" ]; then
            echo "当前 Flutter 非 3.24.5，跳过 dropdown 补丁"
            exit 0
          fi
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT/"
          cd "$FLUTTER_ROOT"
          # 幂等：flutter-action 开了 cache:true 后，热缓存里的 SDK 已含本补丁，
          # 再次 git apply 会报 "already applied" 而失败，故先 --check 探测再决定。
          if git apply --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
            echo "✓ flutter 补丁已应用"
          elif git apply -R --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            echo "✓ flutter 补丁已存在（缓存热命中，跳过）"
          else
            echo "::error::flutter 补丁既无法应用也无法确认已存在"
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: wedesk-bridge
          path: .

      - name: Unpack bridge files
        shell: bash
        run: bash build/common/unpack-bridge.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: wedesk-macos
          key: macos-desktop

      - name: Apply brand customization
        if: ${{ inputs.skip_customize != true }}
        run: python build/client/customize.py --source client --config build/client/custom.toml

      # scrap 的 build.rs 走 find_package()：非 Windows 上必须经 VCPKG_ROOT 找
      # libvpx/aom/libyuv。没有 VCPKG_ROOT 时 Linux 直接 panic（"only for macos
      # aarch64"），macOS 找 /opt/homebrew/Cellar 也没有 → panic —— 这就是上轮
      # 桌面 job 挂在 cargo build 的根因（整轮漏了 vcpkg 安装）。
      # scrap/build.rs 里 ffmpeg() 已被注释掉、opus 由 magnum-opus 自带 C 源码编译，
      # 故 classic 模式只装这三个真正被链接的包，跳过 manifest 里 40 分钟的 ffmpeg。
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      # aom 的汇编器（与 iOS job 同因）
      - name: Install assemblers (nasm/yasm)
        run: brew install nasm yasm

      - name: Install vcpkg dependencies (macos)
        shell: bash
        run: |
          set -e
          if ! "$VCPKG_ROOT/vcpkg" install --triplet arm64-osx libvpx aom libyuv opus; then
            find "${VCPKG_ROOT}/" -name "*.log" 2>/dev/null | while read -r f; do
              echo "--- $f ---"; cat "$f"
            done
            exit 1
          fi
          ls -l "$VCPKG_ROOT/installed/arm64-osx/lib/"

      - name: Build rustdesk lib + service (macos)
        shell: bash
        run: |
          set -eo pipefail
          source build/common/emit-error-lines.sh
          LOG="$RUNNER_TEMP/cargo-build-macos.log"
          # 与上游 build_flutter_dmg 一致：macOS 需把 service bin 一起打进 .app
          if ! (cd client && MACOSX_DEPLOYMENT_TARGET=10.14 cargo build --locked --features flutter --release) 2>&1 | tee "$LOG"; then
            emit_error_lines "$LOG" "cargo:macos" 25
            emit_log_tail "$LOG" "cargo:macos-tail" 40
            emit_summary_tail "$LOG" "cargo build 失败（macOS）—— 日志尾部" 100
            exit 1
          fi
          (cd client && cp target/release/liblibrustdesk.dylib target/release/librustdesk.dylib)
          ls -lh client/target/release/liblibrustdesk.dylib

      - name: Flutter pub get (macos)
        shell: bash
        run: |
          set -eo pipefail
          source build/common/emit-error-lines.sh
          LOG="$RUNNER_TEMP/flutter-pub-get-macos.log"
          if ! (cd client/flutter && flutter pub get) 2>&1 | tee "$LOG"; then
            emit_error_lines "$LOG" "flutter:pub-get-macos" 20
            emit_log_tail "$LOG" "flutter:pub-get-macos-tail" 30
            exit 1
          fi

      - name: Build macOS app
        shell: bash
        run: |
          set -eo pipefail
          source build/common/emit-error-lines.sh
          LOG="$RUNNER_TEMP/flutter-build-macos.log"
          MAC_ARCH="$(uname -m)"
          MAC_ARCH="${MAC_ARCH/aarch64/arm64}"
          if ! (cd client/flutter && FLUTTER_XCODE_ARCHS="$MAC_ARCH" FLUTTER_XCODE_ONLY_ACTIVE_ARCH=YES flutter build macos --release) 2>&1 | tee "$LOG"; then
            emit_error_lines "$LOG" "flutter:macos" 15
            emit_log_tail "$LOG" "flutter:macos-tail" 30
            emit_summary_tail "$LOG" "Build macOS 失败 —— 日志尾部" 80
            exit 1
          fi
          APP_DIR="client/flutter/build/macos/Build/Products/Release"
          if [ -f client/target/release/service ]; then
            find "$APP_DIR" -maxdepth 1 -name '*.app' -exec cp -f client/target/release/service {}/Contents/MacOS/ \;
          fi
          echo "=== 产物 ==="
          find "$APP_DIR" -maxdepth 1 -name '*.app'

      - name: Zip macOS app
        shell: bash
        run: |
          set -e
          APP_DIR="client/flutter/build/macos/Build/Products/Release"
          APP="$(find "$APP_DIR" -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$APP" ] || { echo "::error::未找到 .app"; exit 1; }
          ( cd "$APP_DIR" && zip -r -q "$RUNNER_TEMP/wedesk-macos.zip" "$(basename "$APP")" )
          mv "$RUNNER_TEMP/wedesk-macos.zip" client/flutter/build/macos/wedesk-macos.zip
          ls -lh client/flutter/build/macos/wedesk-macos.zip

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wedesk-macos
          path: client/flutter/build/macos/wedesk-macos.zip
          retention-days: 14

      - name: Build summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Wedesk macOS 构建结果"
            echo ""
            echo "产物在本页底部 Artifacts 的 **wedesk-macos**（.app 的 zip，保留 14 天）。"
            echo ""
            echo "> 解压后拖入 /Applications 即可使用；v1 为纯软编（未启用 hwcodec）。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5b. Linux 桌面客户端（x64）
  #
  #   cargo build 产出 liblibrustdesk.so；flutter/linux/CMakeLists.txt 用
  #   $<CONFIG> 经 TOLOWER 得到 release，引用 ../../target/release/liblibrustdesk.so
  #   （与 cargo 的 target/release 一致），无需手动拷贝。
  #   v1 先关 hwcodec（纯软编）以避开 vcpkg/FFmpeg 链接坑。
  # ---------------------------------------------------------------------------
  build-linux:
    name: linux (desktop x64)
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_linux == true) }}
    needs: [preflight, generate-bridge]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        run: |
          set -e
          # 与上游 docs/upstream/README.md 的 Ubuntu 依赖表对齐：
          # libxdo-dev(enigo 输入模拟)、libxcb-*/libxfixes(scrap 的 X11 截屏)、
          # libasound2-dev(cpal)、libclang-dev(scrap 用 bindgen 生成 FFI)、
          # gstreamer(client/Cargo.toml 恒开 scrap/wayland → gstreamer-app-sys，
          # 缺 dev 包时 gstreamer-sys 的 build script 直接失败)。
          sudo apt-get update -y
          sudo apt-get install -y zip g++ gcc git curl wget nasm yasm \
            libgtk-3-dev clang libxcb-randr0-dev libxdo-dev libxfixes-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev libpulse-dev \
            cmake make libclang-dev ninja-build liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Patch flutter
        shell: bash
        run: |
          set -e
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          if [ "${{ env.FLUTTER_VERSION }}" != "3.24.5" ]; then
            echo "当前 Flutter 非 3.24.5，跳过 dropdown 补丁"
            exit 0
          fi
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT/"
          cd "$FLUTTER_ROOT"
          # 幂等：flutter-action 开了 cache:true 后，热缓存里的 SDK 已含本补丁，
          # 再次 git apply 会报 "already applied" 而失败，故先 --check 探测再决定。
          if git apply --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
            echo "✓ flutter 补丁已应用"
          elif git apply -R --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            echo "✓ flutter 补丁已存在（缓存热命中，跳过）"
          else
            echo "::error::flutter 补丁既无法应用也无法确认已存在"
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: wedesk-bridge
          path: .

      - name: Unpack bridge files
        shell: bash
        run: bash build/common/unpack-bridge.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: wedesk-linux
          key: linux-desktop

      - name: Apply brand customization
        if: ${{ inputs.skip_customize != true }}
        run: python build/client/customize.py --source client --config build/client/custom.toml

      # 同 macOS：scrap 的 build.rs 在非 Windows 上必须经 VCPKG_ROOT 找
      # libvpx/aom/libyuv，否则 find_package() 直接 panic（Linux 无 homebrew 回退）。
      # ffmpeg() 在 scrap/build.rs 里被注释、opus 由 magnum-opus 自带源码编译，
      # 故 classic 模式只装这三个被链接的包，跳过 manifest 的 40 分钟 ffmpeg。
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (linux)
        shell: bash
        run: |
          set -e
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-linux libvpx aom libyuv opus; then
            find "${VCPKG_ROOT}/" -name "*.log" 2>/dev/null | while read -r f; do
              echo "--- $f ---"; cat "$f"
            done
            exit 1
          fi
          ls -l "$VCPKG_ROOT/installed/x64-linux/lib/"

      - name: Build rustdesk lib (linux)
        shell: bash
        run: |
          set -eo pipefail
          source build/common/emit-error-lines.sh
          LOG="$RUNNER_TEMP/cargo-build-linux.log"
          if ! (cd client && cargo build --locked --features flutter --lib --release) 2>&1 | tee "$LOG"; then
            emit_error_lines "$LOG" "cargo:linux" 25
            emit_log_tail "$LOG" "cargo:linux-tail" 40
            emit_summary_tail "$LOG" "cargo build 失败（Linux）—— 日志尾部" 100
            exit 1
          fi
          ls -lh client/target/release/liblibrustdesk.so

      - name: Flutter pub get (linux)
        shell: bash
        run: |
          set -eo pipefail
          source build/common/emit-error-lines.sh
          LOG="$RUNNER_TEMP/flutter-pub-get-linux.log"
          if ! (cd client/flutter && flutter pub get) 2>&1 | tee "$LOG"; then
            emit_error_lines "$LOG" "flutter:pub-get-linux" 20
            emit_log_tail "$LOG" "flutter:pub-get-linux-tail" 30
            exit 1
          fi

      - name: Build Linux bundle
        shell: bash
        run: |
          set -eo pipefail
          source build/common/emit-error-lines.sh
          LOG="$RUNNER_TEMP/flutter-build-linux.log"
          if ! (cd client/flutter && flutter build linux --release) 2>&1 | tee "$LOG"; then
            emit_error_lines "$LOG" "flutter:linux" 15
            emit_log_tail "$LOG" "flutter:linux-tail" 30
            emit_summary_tail "$LOG" "Build Linux 失败 —— 日志尾部" 80
            exit 1
          fi
          # 官方 bundle 内的 .so 未 strip，压一下体积
          find client/flutter/build/linux -name 'liblibrustdesk.so' -exec strip {} \;
          echo "=== 产物 ==="
          ls -lh client/flutter/build/linux/x64/release/bundle/

      - name: Zip Linux bundle
        shell: bash
        run: |
          set -e
          BUNDLE="client/flutter/build/linux/x64/release/bundle"
          [ -d "$BUNDLE" ] || { echo "::error::未找到 bundle 目录"; exit 1; }
          ( cd "$BUNDLE/.." && zip -r -q "$RUNNER_TEMP/wedesk-linux.zip" "bundle" )
          mv "$RUNNER_TEMP/wedesk-linux.zip" client/flutter/build/linux/wedesk-linux.zip
          ls -lh client/flutter/build/linux/wedesk-linux.zip

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wedesk-linux
          path: client/flutter/build/linux/wedesk-linux.zip
          retention-days: 14

      - name: Build summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Wedesk Linux 构建结果"
            echo ""
            echo "产物在本页底部 Artifacts 的 **wedesk-linux**（bundle 的 zip，保留 14 天）。"
            echo ""
            echo "> 解压后运行 bundle/ 内的可执行文件即可；v1 为纯软编（未启用 hwcodec）。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. 服务端 hbbs / hbbr —— Linux musl 静态二进制
  #
  #    服务端是独立 Rust workspace（server/src），与客户端互不影响，
  #    所以能在同一条流水线里并行编译，互不污染 target 与工具链。
  #
  #    产物选择 musl 而非 glibc：静态链接的二进制可以扔到任意发行版上直接跑，
  #    不用管目标机器的 glibc 版本 —— 也是它能被 COPY 进 alpine 的原因。
  # ---------------------------------------------------------------------------
  build-server:
    name: hbbs/hbbr (linux musl)
    # PR 与「仅文档变更」同样跳过；逻辑与 generate-bridge 保持一致
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.should_build == 'true' }}
    needs: [preflight]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # -------------------------------------------------------------------
      # 为什么要在 musl 容器里编译，而不是在 runner 上交叉编译
      # -------------------------------------------------------------------
      # runner 是 glibc 环境。 `cargo build --target x86_64-unknown-linux-musl`
      # 会让 openssl-sys 去找【目标平台】的 OpenSSL，glibc 上的 libssl-dev 对
      # musl 无效，于是报：
      #
      #     Could not find directory of OpenSSL installation, and this `-sys`
      #     crate cannot proceed without this knowledge. ... set OPENSSL_DIR
      #
      # 手工给 musl 再喂一份 OpenSSL 并设 OPENSSL_DIR 当然能过，但那套路径绑死
      # 宿主发行版与 runner 镜像版本，一个 update 就失效。换成本机编译：容器的
      # host triple 本身就是 musl，alpine 的 openssl-dev/sqlite-dev 天生是给
      # musl 编的，pkg-config 一查即中，产物照样是 musl 静态二进制。
      #
      # 编译命令不在这里 —— 它在 server/deploy/build-musl.sh，与 server/deploy/Dockerfile
      # 共用同一份。两份配方一旦各自漂移，就会出现「CI 绿但本机 docker build 红」
      # 这种最难复盘的故障。
      #
      # 挂载 $HOME/.cargo/registry 是为了让 rust-cache 管到依赖包缓存；
      # 挂 target 则直接落回仓库里，下一个 job/step 照原路径取用。
      # -------------------------------------------------------------------
      # workspaces 必须显式指定：
      # rust-cache 默认按仓库根推断 target，而服务端是独立 workspace + 非默认 target，
      # 不写这一行就缓存不命中，每次都从零重编十几个依赖包。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.SERVER_DIR }} -> target/${{ env.SERVER_TARGET }}

      - name: Build hbbs / hbbr / rustdesk-utils in musl container
        id: build
        run: |
          set -e
          # TRIPLE 只在这里定一次，并作为 step output 交给下面的打包步骤。
          # 之前打包步骤直接读 env.SERVER_TARGET，而脚本在未收到 TARGET 时会
          # 退回自己的默认值 —— 两个真源，env 一漏配就变成「编译放到
          # target/x86_64-...-musl/、打包却去 target//release 找」的错位。
          TRIPLE="${SERVER_TARGET:-x86_64-unknown-linux-musl}"
          echo "triple=$TRIPLE" >> "$GITHUB_OUTPUT"
          echo "==> 编译目标三元组：$TRIPLE"
          mkdir -p "$HOME/.cargo/registry" "${SERVER_DIR}/target"
          docker run --rm \
            --volume "$PWD/${SERVER_DIR}:/src" \
            --volume "$PWD/server/deploy/build-musl.sh:/build-musl.sh:ro" \
            --volume "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            --env TARGET="$TRIPLE" \
            "${SERVER_BUILD_IMAGE}" \
            sh /build-musl.sh
          # 容器里是 root，写出来 target/ 与 registry 缓存都归 root；
          # 后面的 upload-artifact 与 rust-cache 由 runner 用户执行会读不到。
          sudo chown -R "$(id -u):$(id -g)" \
            "$HOME/.cargo/registry" "${SERVER_DIR}/target"

      - name: Package server binaries
        id: pack
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          set -e
          V="$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          DIST="$GITHUB_WORKSPACE/out-server"
          mkdir -p "$DIST"
          # 路径由上一个 step 实际使用的三元组决定，不再各自取值。
          BIN="target/${{ steps.build.outputs.triple }}/release"
          if [ ! -f "$BIN/hbbs" ]; then
            # 兜底：没传 --target 时 cargo 直接放在 target/release
            if [ -f "target/release/hbbs" ]; then
              echo "::warning::$BIN/hbbs 不存在，回退到 target/release（未传 --target 时的产物位置）"
              BIN="target/release"
            else
              echo "::error::找不到编译产物。当前 target/ 下的目录结构："
              find target -maxdepth 3 -type d 2>/dev/null | head -30
              echo "::error::以及存在的二进制："
              find target -maxdepth 4 -type f -name 'hbbs' 2>/dev/null | head
              exit 1
            fi
          fi
          for b in hbbs hbbr rustdesk-utils; do cp "$BIN/$b" "$DIST/"; done
          # systemd 单元带上：不用 Docker 的部署方式直接落到 /etc/systemd/system 即可
          [ -d systemd ] && cp -r systemd "$DIST/systemd"
          (cd "$DIST" && sha256sum hbbs hbbr rustdesk-utils > SHA256SUMS.txt)
          (cd "$DIST" && zip -q -r "$DIST/wedesk-server-${V}-linux-x64-musl.zip" \
              hbbs hbbr rustdesk-utils systemd SHA256SUMS.txt)
          echo "=== 服务端产物 ==="
          ls -lh "$DIST"

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: wedesk-server-linux-x64
          path: out-server
          retention-days: 14

      - name: Server build summary
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          {
            echo "## Wedesk 服务端构建结果"
            echo ""
            echo "- hbbs / hbbr / rustdesk-utils：**musl 静态二进制**，任意 Linux 发行版可直接运行"
            echo "- 版本：\`${{ steps.pack.outputs.version }}\`（取自 server/src/Cargo.toml）"
            echo "- 含 systemd 单元，不用 Docker 也能部署"
            echo "- 镜像版本由下一个 \`Push server image\` job 推送到 GHCR"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 6. 服务端容器镜像 —— 推到 Docker Hub（liaozhiming/wedesk-server）
  #
  #    这里刻意用 Dockerfile.prebuilt 而不是 server/deploy/Dockerfile：
  #    后者在容器里从源码编译（方便本机零 Rust 环境构建），
  #    而 CI 里二进制刚在上一个 job 编完，直接 COPY 进去即可，
  #    否则同一个 workspace 要在容器里再编译一遍十几分钟。
  #
  #    需要的仓库 secrets（Settings → Secrets and variables → Actions）：
  #      DOCKER_USERNAME   Docker Hub 用户名
  #      DOCKER_PASSWORD   Docker Hub 的 Personal Access Token
  #                        （用令牌而不是账号密码：账号密码无法做细粒度权限，
  #                         且开启 2FA 后 docker login 会直接失败）
  # ---------------------------------------------------------------------------
  server-image:
    name: Push server image (Docker Hub)
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.should_build == 'true' }}
    needs: [build-server]
    runs-on: ubuntu-latest
    permissions:
      # 推 Docker Hub 用的是仓库 secrets，跟 GITHUB_TOKEN 无关 ——
      # 所以这里不需要 packages: write，最小权限只留读代码
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # -------------------------------------------------------------------
      # 凭据与推送意图，只在这一个 step 里算清楚
      # -------------------------------------------------------------------
      # 为什么要单独一步：docker/login-action 在凭据缺失时的报错是
      # 「Username and password required」，完全看不出是没配 secrets 还是配错了。
      # 而且 fork 出来的仓库默认拿不到 secrets —— 不加这一步，每个 PR 都会
      # 报一个莫名其妙的登录失败。
      #
      # 结果分三态：
      #   want=true  + 凭据齐 → push=true   正常发布
      #   want=true  + 凭据缺 → 硬失败       该发版却发不出去，必须让人看见
      #   want=false          → 只构建不推送 说明"为什么没推"，不许含糊其辞
      #
      # 修过的一个坑：这三个分支都曾共用一句"未配置 ${missing:-凭据}"。
      # want=false 而凭据其实齐全时，它会打印出兜底词"凭据"，变成
      # "未配置 凭据"，把人引向"密钥没配上"的错误方向 —— 实际密钥是好的，
      # 只是这次事件类型不该推送。现在两种原因分开说。
      # -------------------------------------------------------------------
      - name: 计算是否推送镜像
        id: plan
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_PASS: ${{ secrets.DOCKER_PASSWORD }}
          # 触发推送的三种事件：打标签发布、手动触发、推送到 main
          WANT: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # 预发布标签（v1.2.3-rc1 / -beta.1）不抢 latest
          IS_PRERELEASE: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') }}
        run: |
          set -e

          # 1) 凭据缺什么
          missing=""
          if [ -z "${DH_USER}" ]; then missing="DOCKER_USERNAME"; fi
          if [ -z "${DH_PASS}" ]; then
            if [ -n "${missing}" ]; then
              missing="${missing} 与 DOCKER_PASSWORD"
            else
              missing="DOCKER_PASSWORD"
            fi
          fi

          echo "事件：${EVENT}   ref：${REF}"
          if [ -n "${missing}" ]; then
            echo "::error::仓库缺少 secrets：${missing}"
            echo "::error::到 Settings → Secrets and variables → Actions 添加后重跑本 workflow。"
            exit 1
          fi
          echo "✓ DOCKER_USERNAME / DOCKER_PASSWORD 均已配置"

          # 2) 该不该推
          push=false
          if [ "${WANT}" = "true" ]; then push=true; fi

          # 3) latest 只在「推送 + 非预发布」时移动。
          #    放 shell 里判，而不是写成 GH 行内表达式 —— GH 表达式的 ! 取反
          #    与 && 优先级在不同版本 runner 上出现过差异，布尔运算交给 sh 最稳。
          #    （注释里千万别照抄 GH 表达式的字面写法当示例：runner 会在编译期
          #     连 run 脚本一起做语法校验，空表达式会让整个工作流失效）
          latest=false
          if [ "${push}" = "true" ] && [ "${IS_PRERELEASE}" != "true" ]; then
            latest=true
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          if [ "${push}" = "true" ]; then
            echo "✓ 本次将推送镜像到 ${DH_NAMESPACE}/${DH_REPO}"
            if [ "${latest}" != "true" ]; then
              echo "  （预发布标签，不移动 latest）"
            fi
          else
            echo "::warning::本次不是发布场景（事件=${EVENT}，ref=${REF}）。"
            echo "::warning::只构建镜像做验证，不推送。要发布镜像请："
            echo "::warning::  1) 推送 v* 标签（推荐，见 build\\tag-release.bat），或"
            echo "::warning::  2) 推送到 main 分支，或"
            echo "::warning::  3) Actions 页面手动 workflow_dispatch 触发。"
          fi

          # 命名空间必须是登录账号本人（或其所属组织），否则 push 会被 Docker Hub
          # 拒绝并报「denied: requested access to the resource is denied」。
          # 这里只告警：用组织令牌等场景登录名可以不同于命名空间，不能一刀切判死。
          if [ "${DH_USER}" != "${DH_NAMESPACE}" ]; then
            echo "::warning::DOCKER_USERNAME=${DH_USER} 与镜像前缀 ${DH_NAMESPACE}/ 不同 ——"
            echo "::warning::若 ${DH_USER} 不属于 ${DH_NAMESPACE} 这个组织，push 会被拒绝。"
          fi

          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: wedesk-server-linux-x64
          path: dist-server

      # -------------------------------------------------------------------
      # 下载回来的产物必须重新补可执行位 —— 这一步是必需的，不是保险
      # -------------------------------------------------------------------
      # upload-artifact@v4 / download-artifact@v4 走 zip 打包，【不保留 POSIX
      # 可执行位】。产物在 build-server job 里明明是 0755，传到这个 job 就退化成
      # 0644；COPY 会把这个 mode 原样带进镜像。
      #
      # 于是容器启动时报：
      #     exec: "hbbr": executable file not found in $PATH
      # 注意它报的是 "not found" 而不是 "permission denied" —— 因为 Docker
      # 解析 command 第一段走 PATH 查找，而 PATH 查找要求可执行位。这句话把
      # "文件在、只是没 +x" 说成了 "找不到文件"，极易把人引向 "COPY 写错了"
      # 的错误方向。且构建期全程无报错，只在 up 时才炸。
      #
      # Dockerfile.prebuilt 里也补了一次 chmod（双保险），这里额外把 mode
      # 打印出来，日后一眼能确认产物状态。
      # -------------------------------------------------------------------
      - name: 修复产物可执行位并校验
        run: |
          set -e
          cd dist-server
          echo "=== 下载回来的产物 ==="
          ls -l
          chmod 0755 hbbs hbbr rustdesk-utils
          echo "=== chmod 之后 ==="
          ls -l hbbs hbbr rustdesk-utils
          for b in hbbs hbbr rustdesk-utils; do
            [ -f "$b" ] || { echo "::error::缺少产物 $b"; exit 1; }
            [ -s "$b" ] || { echo "::error::$b 是空文件（0 字节）"; exit 1; }
            [ -x "$b" ] || { echo "::error::$b 仍不可执行"; exit 1; }
          done
          echo "✓ 三个产物均存在、非空且可执行"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ steps.plan.outputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          # registry 留空即为 Docker Hub（docker.io）
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DH_NAMESPACE }}/${{ env.DH_REPO }}
          tags: |
            # latest 只在「本次会推送 且 非预发布」时才移动
            type=raw,value=latest,enable=${{ steps.plan.outputs.latest }}
            # v* 标签本身
            type=ref,event=tag
            # commit sha 标签：始终生成，保证 tags 不为空（buildx 不接受空 tags），
            # 也便于把某台服务器上的镜像精确回溯到某次提交
            type=sha,format=long,prefix=sha-,enable=${{ steps.plan.outputs.push }}

      # 只有发版和手动触发才真正推送。
      # push=false 时 build-push-action 依然会完整构建 —— 日常提交也能验证
      # Dockerfile 没被改坏，这是它比"干脆不跑"值钱的地方。
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./dist-server
          file: ./server/deploy/Dockerfile.prebuilt
          platforms: linux/amd64
          push: ${{ steps.plan.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=wedesk-server-image
          cache-to: type=gha,scope=wedesk-server-image,mode=max

      - name: Image summary
        run: |
          {
            echo "## 服务端镜像"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 镜像 | \`${{ env.DH_NAMESPACE }}/${{ env.DH_REPO }}\` |"
            echo "| 触发事件 | ${{ github.event_name }}（ref=${{ github.ref }}） |"
            echo "| 是否推送 | ${{ steps.plan.outputs.push }} |"
            echo "| 是否移动 latest | ${{ steps.plan.outputs.latest }} |"
            echo ""
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
            echo ""
            echo "拉取：\`docker pull ${{ env.DH_NAMESPACE }}/${{ env.DH_REPO }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 7. 发布 GitHub Release（仅 v* 标签）
  #
  #    为什么单独一个 job 而不在 build-windows 里顺手做：
  #    发布需要 contents: write 权限。单独一个 job 能把权限收敛到最小范围，
  #    构建环节依然只有 read —— 构建机上的第三方 action 碰不到发布能力。
  #
  #    为什么 needs 里挂了安卓/iOS/macOS/Linux 却不要求它们成功：
  #    iOS 需要 Apple 证书生态、Android armeabi-v7a 的 vcpkg 依赖链最脆，
  #    让它们中的任何一个拦住 Windows 客户端发版，代价明显不对等。
  #    缺哪个端会写进 Release Notes，不静默。
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    # 服务端编译失败不应阻断客户端发布 —— 两者是独立产物，
    # 用户仍可拿到客户端；服务端缺失会在 Release Notes 里标注。
    # 但如果客户端本身没成功，就什么都不发：没有客户端的 Release 没有意义。
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && needs.build-windows.result == 'success' }}
    needs: [build-windows, build-server, build-android-apk, build-ios, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # 版本号必须与 client/Cargo.toml 一致。发错的 Recovery 成本远高于构建失败：
      # 发出去的版本号是错的，用户下载后无法判断自己装的是什么，
      # 而删除重发又会让已发出去的链接失效。
      - name: 校验标签版本与 client/Cargo.toml 一致
        id: ver
        shell: bash
        run: |
          set -e
          CARGO_VER="$(grep -m1 -E '^version = ' client/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          TAG="$GITHUB_REF_NAME"
          TAG_VER="${TAG#v}"
          echo "client/Cargo.toml 版本: $CARGO_VER"
          echo "标签:            $TAG （解析为 $TAG_VER）"
          if [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "::error::标签 $TAG 与 client/Cargo.toml 的 $CARGO_VER 不一致。"
            echo "::error::请先对齐版本再打标签 —— 用 build/common/tag-release.bat 可自动取 client/Cargo.toml 的版本号。"
            exit 1
          fi
          echo "version=$CARGO_VER" >> "$GITHUB_OUTPUT"
          # v1.2.3-beta.1 / -rc1 算预发布：不抢 latest 标签
          case "$TAG_VER" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # 只警告不阻断：偶尔确有需要在非 main 提交上发版的场景
      - name: 检查标签是否指向 main
        shell: bash
        run: |
          set -e
          git fetch origin main 2>/dev/null || true
          if git rev-parse --verify -q origin/main >/dev/null; then
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main 2>/dev/null; then
              echo "✓ 标签指向的提交已在 main 上"
            else
              echo "::warning::标签指向的提交不在 main 上 —— 请确认这是预期的发布点"
            fi
          else
            echo "::warning::取不到 origin/main，跳过分支归属校验"
          fi

      - name: 下载便携版
        uses: actions/download-artifact@v4
        with:
          name: wedesk-windows-x64
          path: dist/portable

      - name: 下载 MSI（若构建）
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wedesk-windows-x64-msi
          path: dist/msi

      # 服务端缺失不阻断发布：它是 continue-on-error 的兄弟产物
      - name: 下载服务端（若构建）
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wedesk-server-linux-x64
          path: dist/server

      # Android / iOS 同理：缺了只少一个端，不该让已经编好的 Windows 版发不出去。
      # 它们可能是被 workflow_dispatch 的输入关掉的，也可能是某个 ABI 编挂了，
      # 两种情况都不影响"Windows 客户端 + 服务端"这套主产物成立。
      - name: 下载 Android 产物（若构建）
        id: dl-android
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wedesk-android
          path: dist/android

      - name: 下载 iOS 产物（若构建）
        id: dl-ios
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wedesk-ios
          path: dist/ios

      - name: 下载 macOS 桌面产物（若构建）
        id: dl-macos
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wedesk-macos
          path: dist/macos

      - name: 下载 Linux 桌面产物（若构建）
        id: dl-linux
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wedesk-linux
          path: dist/linux

      - name: 打包并生成校验和
        id: pack
        shell: bash
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          mkdir -p out
          # exe 名由 client/build.py 决定（当前硬编码 rustdesk.exe），不写死，
          # 免得以后改了名字 Release 说明还在指向不存在的文件
          EXE="$(cd dist/portable && ls *.exe 2>/dev/null | head -1 || true)"
          echo "exe=${EXE:-rustdesk.exe}" >> "$GITHUB_OUTPUT"
          (cd dist/portable && zip -q -r "$GITHUB_WORKSPACE/out/wedesk-${V}-windows-x64-portable.zip" .)
          if [ -f dist/msi/wedesk-x64.msi ]; then
            cp -f dist/msi/wedesk-x64.msi "out/wedesk-${V}-windows-x64.msi"
            echo "has_msi=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_msi=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未找到 MSI，本次 Release 只含便携版"
          fi
          # 服务端：CI 已经打好了 zip，这里原样带过去不再二次压缩，
          # 免得 Release 里的 zip 与 CI artifact 的 SHA256 对不上
          has_server=false
          if [ -f dist/server/hbbs ]; then
            cp -f dist/server/*.zip out/ 2>/dev/null || true
            cp -f dist/server/hbbs dist/server/hbbr dist/server/rustdesk-utils out/
            has_server=true
          else
            echo "::warning::未找到服务端产物（build-server job 可能失败或被跳过）"
          fi
          echo "has_server=$has_server" >> "$GITHUB_OUTPUT"
          # Android：APK 按 ABI 分包 + AAB。
          # 两个 glob 分开判存在：写进同一条 cp 时，只要其中一个没匹配上，
          # bash 会把字面量原样传给 cp 并让整条命令失败（哪怕另一个其实拷贝成功了）。
          has_android=false
          if ls dist/android/*.apk >/dev/null 2>&1; then
            cp -f dist/android/*.apk out/
            has_android=true
          fi
          if ls dist/android/*.aab >/dev/null 2>&1; then
            cp -f dist/android/*.aab out/
            has_android=true
          fi
          if [ "$has_android" = "false" ]; then
            echo "::warning::未找到 Android 产物（build-android-apk 可能失败或被跳过）"
          fi
          echo "has_android=$has_android" >> "$GITHUB_OUTPUT"
          # iOS：未签名 IPA（目录里理论只有一个，取第一个避免 cp 多文件到单文件名报错）
          has_ios=false
          IPA="$(ls dist/ios/*.ipa 2>/dev/null | head -1 || true)"
          if [ -n "$IPA" ]; then
            cp -f "$IPA" "out/wedesk-${V}-ios-unsigned.ipa"
            has_ios=true
          else
            echo "::warning::未找到 iOS 产物（build-ios 可能失败或被跳过）"
          fi
          echo "has_ios=$has_ios" >> "$GITHUB_OUTPUT"
          # macOS 桌面：未签名的 .app zip（解开后拖入 /Applications）
          has_macos=false
          MACOS_ZIP="$(ls dist/macos/wedesk-macos.zip 2>/dev/null | head -1 || true)"
          if [ -n "$MACOS_ZIP" ]; then
            cp -f "$MACOS_ZIP" "out/wedesk-${V}-macos.zip"
            has_macos=true
          else
            echo "::warning::未找到 macOS 桌面产物（build-macos 可能失败或被跳过）"
          fi
          echo "has_macos=$has_macos" >> "$GITHUB_OUTPUT"
          # Linux 桌面：x64 bundle zip
          has_linux=false
          LINUX_ZIP="$(ls dist/linux/wedesk-linux.zip 2>/dev/null | head -1 || true)"
          if [ -n "$LINUX_ZIP" ]; then
            cp -f "$LINUX_ZIP" "out/wedesk-${V}-linux.zip"
            has_linux=true
          else
            echo "::warning::未找到 Linux 桌面产物（build-linux 可能失败或被跳过）"
          fi
          echo "has_linux=$has_linux" >> "$GITHUB_OUTPUT"
          cd out
          sha256sum ./* > SHA256SUMS.txt
          echo "=== 待发布文件 ==="
          ls -lh
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: 生成 Release Notes
        shell: bash
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          TAG="$GITHUB_REF_NAME"
          EXE="${{ steps.pack.outputs.exe }}"
          REPO="${{ github.repository }}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          SERVER_PKG="$(ls dist/server/*.zip 2>/dev/null | head -1 | xargs -r basename || true)"
          {
            echo "## 企业网管助手 v${V}"
            echo ""
            echo "客户端已内置私有服务器地址与公钥，服务端由本仓库源码自行编译 —— 两者配套发布。"
            echo ""
            echo "### 客户端（Windows x64）"
            echo ""
            echo "| 文件 | 说明 |"
            echo "|---|---|"
            echo "| \`wedesk-${V}-windows-x64-portable.zip\` | 便携版：解压后运行 \`${EXE}\`，无需安装 |"
            if [ "${{ steps.pack.outputs.has_msi }}" = "true" ]; then
              echo "| \`wedesk-${V}-windows-x64.msi\` | 安装包：适合域控 / 组策略批量部署 |"
            fi
            echo ""
            echo "### 客户端（Android）"
            echo ""
            if [ "${{ steps.pack.outputs.has_android }}" = "true" ]; then
              echo "按 ABI 分包，按设备架构挑一个装即可；AAB 用于上传 Google Play。"
              echo ""
              echo "| 文件 | 说明 |"
              echo "|---|---|"
              for f in out/wedesk-${V}-android-*.apk; do
                [ -f "$f" ] && echo "| \`$(basename "$f")\` | Android 安装包（**debug 签名**，正式分发请重签） |"
              done
              echo "| \`wedesk-${V}-android.aab\` | Android App Bundle，上传 Google Play 用 |"
            else
              echo "_本次未产出 Android 包 —— 查看 build-android-apk job 日志。_"
            fi
            echo ""
            echo "### 客户端（iOS）"
            echo ""
            if [ "${{ steps.pack.outputs.has_ios }}" = "true" ]; then
              echo "| 文件 | 说明 |"
              echo "|---|---|"
              echo "| \`wedesk-${V}-ios-unsigned.ipa\` | **未签名**：需由具备 Apple 开发者证书的一方重签后才能真机安装 / 上架 |"
            else
              echo "_本次未产出 iOS 包 —— 查看 build-ios job 日志（未签名 IPA 也需要 macOS runner 可用）。_"
            fi
            echo ""
            echo "### 服务端（Linux x64 / musl 静态）"
            echo ""
            if [ "${{ steps.pack.outputs.has_server }}" = "true" ]; then
              echo "自行编译的 hbbs / hbbr，非官方镜像；已关闭向 api.rustdesk.com 的版本检查。"
              echo ""
              echo "| 文件 | 说明 |"
              echo "|---|---|"
              echo "| \`${SERVER_PKG}\` | 含 hbbs / hbbr / rustdesk-utils 与 systemd 单元 |"
              echo "| \`hbbs\` / \`hbbr\` / \`rustdesk-utils\` | 裸二进制，musl 静态链接，任意发行版可直接运行 |"
              echo "| 容器镜像 \`${{ env.DH_NAMESPACE }}/${{ env.DH_REPO }}:latest\` | 本版镜像，\`docker pull\` 即可 |"
            else
              echo "::warning::本次未产出服务端二进制 —— 请查看 build-server job 日志"
              echo "本次未随附服务端二进制（构建未成功）。使用上一版本或本地构建："
              echo "\`\`\`bash"
              echo "cd server && docker build -t wedesk-server:latest ."
              echo "\`\`\`"
            fi
            echo ""
            echo "| \`SHA256SUMS.txt\` | 上述全部文件的校验和，分发前请核对 |"
            echo ""
            echo "### 更新内容"
            echo ""
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "$PREV..$TAG"
              echo ""
              echo ""
              echo "完整对比：[\`${PREV}...${TAG}\`](https://github.com/${REPO}/compare/${PREV}...${TAG})"
            else
              echo "- 首个版本"
            fi
            echo ""
            echo "### 部署提示"
            echo ""
            echo "- 服务端需与本客户端使用**同一套密钥**，否则连不上"
            echo "- 便携版请整体拷贝目录，单独拷 exe 会缺依赖 DLL 与驱动"
            echo "- 首次被控若提示安装虚拟显示器驱动（usbmmidd），允许即可"
            echo ""
            echo "详细步骤见 [部署指南](https://github.com/${REPO}/blob/main/docs/04-deploy.md)。"
            echo ""
            echo "### 许可证"
            echo ""
            echo "本软件基于 RustDesk 二次开发，遵循 **AGPL-3.0**。"
            echo "下方 Source code 附件由 GitHub 自动生成，即完整源码，满足许可证要求。"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "wedesk v${{ steps.ver.outputs.version }}"
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.ver.outputs.prerelease != 'true' }}
          # MSI / 服务端缺失是允许的（构建步骤有 continue-on-error 保护），
          # 但不该因为少一个文件就让整个 Release 失败
          fail_on_unmatched_files: false
          files: |
            out/*.zip
            out/*.msi
            out/*.apk
            out/*.aab
            out/*.ipa
            out/SHA256SUMS.txt
            out/hbbs
            out/hbbr
            out/rustdesk-utils

      - name: Release 摘要
        shell: bash
        run: |
          {
            echo "## Release 已发布"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`v${{ steps.ver.outputs.version }}\` |"
            echo "| 预发布 | ${{ steps.ver.outputs.prerelease }} |"
            echo "| 含 MSI | ${{ steps.pack.outputs.has_msi }} |"
            echo "| 含 Android APK/AAB | ${{ steps.pack.outputs.has_android }} |"
            echo "| 含 iOS IPA（未签名） | ${{ steps.pack.outputs.has_ios }} |"
            echo "| 含服务端 hbbs/hbbr | ${{ steps.pack.outputs.has_server }} |"
            echo "| 服务端镜像 | \`${{ env.DH_NAMESPACE }}/${{ env.DH_REPO }}:latest\` |"
            echo "| 地址 | ${{ steps.publish.outputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
