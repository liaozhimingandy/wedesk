# =============================================================================
# RustDesk 定制客户端配置 —— 唯一需要你修改的文件
# =============================================================================
# 改好后执行：
#     python customize.py --source <rustdesk源码路径> --config custom.toml --dry-run
# 确认输出符合预期后去掉 --dry-run 正式写入。
# =============================================================================

[server]
# ============================ 自建服务器 ============================
# ID/注册服务器地址，可写域名或 IP。不带端口时自动使用 5187。
#  !! 端口必须显式写出来 !!
#  客户端内置的兜底端口是 21116，而我们服务端跑在 5187。不写端口的话，
#  客户端会去连 wedesk.alsoapp.com:21116 —— 表现是"ID 一直显示未就绪"。
#  填域名时的前提：客户端所在网络的 DNS 能解析它；解析到的是 hbbs 那台机器。
#  服务端端口定义见 ../docs/10-ports.md：hbbs 主端口 5187，hbbr 主端口 5188。
#  !! 不要用环回地址，必须填客户端真正能连到的那个地址 !!
rendezvous_host = "wedesk.alsoapp.com:5187"

# 服务器公钥：hbbs 首次启动后生成的 id_ed25519.pub 内容。
#  获取方式： cd ../server && python rdctl.py key
#  !! 必须与你服务器上的公钥完全一致，否则所有连接都会被拒绝 !!
#  换域名/换服务器后务必重新获取并替换，然后重新构建客户端。
#  注意：公钥绑定的是"hbbs 那台机器"，不是域名。同一个域名换 DNS 指向别的机器，
#       公钥也会变，客户端必须跟着改。
key = "bMwHjGjrhpNvD+lyhx2daVmrhmq94hyDfHNisznZTl0="

# 中继服务器地址。必须带端口：hbbr 与 hbbs 主端口不同（5188 vs 5187），
# 省略端口会被客户端当成 hbbs 的端口去连，中继握手必然失败。
# 留空表示与 rendezvous_host 同机、端口由客户端按内置默认值推导 —— 我们不走这条路。
relay_host = "wedesk.alsoapp.com:5188"


[brand]
# ============================== 品牌定制 ==============================
# 界面、标题栏、安装目录名中显示的产品名（可用中文）
app_name = "WeDesk"

# ASCII 品牌名：用于必须是英文/文件名安全的场合 —— MSI 安装包的界面文案、
#  Windows 服务显示名、Windows 防火墙规则名、Linux 桌面入口等。
# 与 app_name 分开是因为中文名进 WiX 字符串资源和部分注册表项容易踩坑。
product_name = "WeDesk"

# 生成的可执行文件名（不含 .exe），只能用小写字母与数字，避免路径问题
exe_name = "nethelper"

# 显示在"关于"与 Windows 属性里的公司名
company_name = "贵公司名称"

# 官网域名，用于替换界面里的帮助/隐私政策链接
website = "https://wedesk.alsoapp.com"


[advanced]
# ============================== 进阶选项 ==============================
# 移除源码中向官方 admin.rustdesk.com 发起请求的兜底地址。
# 定制客户端用不上官方 API，置空可保证客户端不与任何官方域名通信。
# 强烈建议保持 true —— 这是"数据不出内网"合规要求的关键一环。
remove_official_api_fallback = true
