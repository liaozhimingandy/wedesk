# =============================================================================
# Wedesk —— Windows 客户端构建
#
# 与上游 rustdesk/rustdesk 的关键差异（也是这份文件存在的理由）：
#
#   1. libs/hbb_common 等子模块已实体化（vendored），checkout 不需要 submodules，
#      clone 下来即可构建。省掉 --recursive 也避免了 submodule 拉不下来导致 CI 红。
#   2. 源码根 == 仓库根（扁平化），所有路径都是相对仓库根的。
#   3. 构建前会执行 build/customize.py 做品牌/服务器注入，
#      唯一输入是仓库里的 build/custom.toml（可用 workflow_dispatch 输入覆盖）。
#   4. 不签名。产物以 Artifact 供日常下载；推送 v* 标签时额外发布 GitHub Release。
#   5. 服务端 hbbs/hbbr 由 build-server job 在同一条流水线里编译 —— 文件名沿用
#      build-windows.yml 是为了保留既有的 Actions 连接与 badge，但这个文件现在
#      产出的是「客户端 + 服务端」两套产物，一次发版两样都有。
#
#      为什么不拆成第二条流水线：两条流水线都要往同一个 GitHub Release 传文件，
#      而发布 job 分属两个 workflow 就必然出现竞态 —— 谁先跑完谁创建 Release，
#      后到的要么覆盖、要么失败。合并进同一条流水线是这个竞态的根治手段。
#
# 流水线为什么是两个 job：
#   bridge_generated.rs / generated_bridge.dart 是 flutter_rust_bridge 生成的，
#   且被 .gitignore 排除（构建产物不属于源码）。它们的生成依赖 cargo-expand +
#   dart pub get，跑起来不便宜，所以单独一个 job 做完再传给 Windows job，
#   也方便本地复用同样的产物。
#
# 为什么没有用 paths-ignore：
#   paths-ignore 对 tag push 同样生效（比较 tag 指向的 commit 与其父提交），
#   于是"最后一次提交只改了文档然后再打 tag"会静默不触发 —— 版本发布凭空消失，
#   且没有任何失败提示。所以改用 preflight 里的变更判断来跳构建，
#   既保住"改文档不烧 40 分钟机时"的收益，又保证 tag 一定能触发。
# =============================================================================

name: Build Wedesk (Client + Server)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hwcodec:
        description: "启用硬件编解码（NVENC/QSV/AMF）。关闭可省 40+ 分钟构建时间，但被控端只能软件编码，CPU 占用显著变高"
        type: boolean
        default: true
      build_args:
        description: "传给 build.py 的额外参数，例如 --vram（显存编码，进一步降低延迟与 CPU）"
        required: false
        default: "--vram"
      company_name:
        description: "公司/组织名，留空则沿用 build/custom.toml 里的值"
        required: false
        default: ""
      website:
        description: "官网地址，留空则沿用 build/custom.toml 里的值"
        required: false
        default: ""
      skip_customize:
        description: "跳过品牌注入（调试 CI 本身时用）"
        type: boolean
        default: false
      build_msi:
        description: "额外构建 MSI 安装包（较慢，有 continue-on-error 保护，失败不阻断便携版）"
        type: boolean
        default: true

# 显式收敛权限：本流水线只上传 artifact，不需要写仓库
permissions:
  contents: read

env:
  # ---- 版本锁定，全部对齐上游 CI，改动前请先确认上游 flutter-build.yml ----
  RUST_VERSION: "1.75" # 1.78 有 i128 ABI 变更，会导致 sciter/bridge 不兼容
  FLUTTER_VERSION: "3.24.5"
  # bridge 用 3.22.3 生成，与上游一致：产物平台无关，但与 freezed 版本耦合
  FLUTTER_BRIDGE_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  LLVM_VERSION: "15.0.6"
  # vcpkg 版本：2026.07.29。改这个值记得同步更新 vcpkg.json 的 builtin-baseline
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_TRIPLET: "x64-windows-static"
  # x-gha 让 vcpkg 用 GitHub Actions Cache 当二进制缓存，
  # 少了这个每次都要重编译 aom/libvpx/ffmpeg，单次 40 分钟以上
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

  # ---- 服务端（server/rustdesk-server 是独立 workspace，工具链单独定） ----
  # 服务端 Cargo.lock 是 lockfile v4，cargo < 1.78 读不了；它的依赖
  # （sqlx 0.6 / tokio 1.44+ / git 上游包）也普遍要求较新的编译器。
  # 客户端之所以锁 1.75 是 sciter/bridge 的 i128 ABI 之故，两个 workspace 互不干扰。
  #
  # 编译器版本不再在这里写 —— 它由 SERVER_BUILD_IMAGE 决定：服务端在 musl 容器里
  # 本机编译（见 build-server job 的说明），容器内自带 Rust，不再依赖 runner 上
  # 安装的工具链。要换版本就把这里和 server/Dockerfile 的 ARG RUST_IMAGE 一起改。
  SERVER_BUILD_IMAGE: "rust:1.90-alpine"
  SERVER_DIR: "server/rustdesk-server"
  # 目标三元组。必须与 server/build-musl.sh 的 TARGET 默认值、以及
  # server/Dockerfile 的 ARG TARGET 默认值三者一致 ——
  # cargo 只有在传了 --target 时才把产物放进 target/<triple>/，
  # 编译与打包一旦对 triple 的理解不一致，就会拼出 target//release 这种空路径。
  SERVER_TARGET: "x86_64-unknown-linux-musl"

jobs:
  # ---------------------------------------------------------------------------
  # 0. 前置校验：花 10 秒发现"配置写了但没注入"这类低级错误，
  #    好过让用户等到 40 分钟后才发现客户端连的还是官方服务器。
  # ---------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 需要完整历史才能 diff 出变更文件（gate）与生成 Release Notes
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------------
      # 构建门禁：代替 on.push.paths-ignore。
      # paths-ignore 会把"只改了文档的那次提交上打的 tag"一并过滤掉，
      # 导致 Release 静默不发布；这里改成显式判断，tag 一定放行。
      # ------------------------------------------------------------------
      - name: 判断是否需要构建
        id: gate
        shell: bash
        run: |
          set -e
          # tag push 必须构建：下游要发 Release，不能因为只改了文档就不产出
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag push（$GITHUB_REF_NAME）→ 构建并发布 Release"
            exit 0
          fi
          # 手动触发：用户点了就跑
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }} → 构建"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          # 首次推送时 before 是全 0，取不到 diff
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "首次推送 → 构建"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || true)"
          if [ -z "$CHANGED" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "无法判定变更范围 → 保守起见构建"
            exit 0
          fi
          if echo "$CHANGED" | grep -qvE '^(docs/|upstream/|.*\.md$)'; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "有代码变更 → 构建"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "仅文档 / 上游说明变更 → 跳过构建（省约 40 分钟机时）"
          fi
          echo ""
          echo "变更文件："
          echo "$CHANGED"

      - name: 确认仓库是自包含的（子模块已实体化）
        run: |
          set -e
          if [ -f .gitmodules ]; then
            echo "::error::检测到 .gitmodules —— 本仓库应已 vendored 全部子模块"
            exit 1
          fi
          # 上游 rustdesk-server 的 libs/hbb_common 也是 submodule。
          # 它要是空的，服务端编译会以"找不到 crate hbb_common"告终，
          # 而日志里看不出"其实是忘了初始化子模块"——所以在这里显式查。
          for f in \
            libs/hbb_common/src/lib.rs \
            libs/scrap/Cargo.toml \
            libs/enigo/Cargo.toml \
            ${{ env.SERVER_DIR }}/Cargo.toml \
            ${{ env.SERVER_DIR }}/src/main.rs \
            ${{ env.SERVER_DIR }}/libs/hbb_common/src/lib.rs; do
            if [ ! -f "$f" ]; then
              echo "::error::子模块未实体化: $f"
              exit 1
            fi
          done
          echo "✓ 客户端与服务端依赖均已实体化"

      - name: 品牌注入预演（不写盘）
        run: |
          set -e
          python build/customize.py --source . --config build/custom.toml --dry-run
          if grep -rq "Purslane Tech Pte. Ltd." Cargo.toml flutter/windows/runner/Runner.rc; then
            echo "::error::仍残留上游公司名 —— 请执行 python build/customize.py"
            exit 1
          fi
          if grep -q 'rust-ny.rustdesk.com' libs/hbb_common/src/config.rs; then
            echo "::error::服务器地址仍是官方默认值"
            exit 1
          fi
          echo "✓ 品牌/服务器定制已就位"

  # ---------------------------------------------------------------------------
  # 1. 生成 flutter-rust-bridge 胶水代码
  #    产物平台无关，所以在 Linux 上生成（与上流 CI 完全同版本组合，风险最低）
  # ---------------------------------------------------------------------------
  generate-bridge:
    # PR 只做 preflight，不烧 40 分钟构建机时；仅文档变更的提交同理跳过。
    # 注意不是用 concurrency 取消，而是直接不触发：vcpkg 的二进制缓存有读写竞争，
    # 频繁取消/重跑反而容易把缓存写坏。
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.should_build == 'true' }}
    # 必须显式 needs 才能访问 needs.preflight.outputs —— 否则 context 为空，
    # 上面那个 == 'true' 恒不成立，这个 job 永远不跑
    needs: [preflight]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ libclang-dev libgtk-3-dev \
            llvm-dev nasm ninja-build pkg-config wget fuse libfuse2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: wedesk-bridge

      # 关键：codegen 二进制装到独立的根目录再缓存。
      # 若直接 cargo install 到默认的 ~/.cargo/bin，缓存它又会污染 Rust 命令本身，
      # 两者互相踩。"安装到独立目录"避免了这个耦合。
      - name: Cache flutter_rust_bridge_codegen
        id: cache-frb
        uses: actions/cache@v4
        with:
          path: .tools/frb
          key: frb-${{ runner.os }}-${{ env.FLUTTER_RUST_BRIDGE_VERSION }}-ce${{ env.CARGO_EXPAND_VERSION }}-rust${{ env.RUST_VERSION }}

      - name: Install flutter rust bridge deps
        if: steps.cache-frb.outputs.cache-hit != 'true'
        run: |
          set -e
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked --root "$PWD/.tools/frb"
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} \
            --features uuid --locked --root "$PWD/.tools/frb"

      - name: Install flutter (bridge generation only)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_BRIDGE_VERSION }}
          cache: true

      - name: Downgrade extended_text for Dart 3.22
        # Flutter 3.22.3 的 Dart 解析不了 extended_text 14，降到 13 才能 pub get。
        # 只影响 bridge 生成，Windows 侧用的是仓库原始的 pubspec。
        run: |
          cd flutter
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get

      - name: Run flutter rust bridge
        run: |
          set -e
          "$PWD/.tools/frb/bin/flutter_rust_bridge_codegen" \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          ls -l ./src/bridge_generated*.rs ./flutter/lib/generated_bridge*.dart

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedesk-bridge
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Windows x64 构建
  # ---------------------------------------------------------------------------
  build-windows:
    name: x86_64-pc-windows-msvc
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.should_build == 'true' }}
    needs: [preflight, generate-bridge]
    runs-on: windows-2022

    # ---- inputs 兜底（本流水线最容易踩的坑，改动前请先读完） --------------
    # `inputs` context 只在 workflow_dispatch 触发时才有值。
    # push 触发时 inputs.hwcodec 是空的，而 `if: ${{ inputs.hwcodec }}` 对空值
    # 判 false —— 于是 input 里写的 default: true 完全不生效。
    #
    # 后果远不止"步骤被跳过"：
    #   1. Verify FFmpeg headers 不跑，缺失不会被发现
    #   2. vcpkg 的 host triplet 退回 x64-windows → FFmpeg 被静默跳过
    #   3. build.py 拿不到 --hwcodec → 产物是软件编码版
    #   4. 流水线依然全绿 —— 这是静默降级，比构建失败更难发现
    #
    # 所以在 job 级显式兜底，让非手动触发时按设计意图走。
    #
    # 另一个坑：env 里存的是字符串 "true"/"false"，而 Actions 中非空字符串
    # 一律 truthy（"false" 也是真）。因此下面每处判断都必须写成 == 'true'，
    # 绝不能简写成 if: ${{ env.ENABLE_HWCODEC }}。
    env:
      ENABLE_HWCODEC: ${{ github.event_name != 'workflow_dispatch' || inputs.hwcodec == true }}
      # 末尾的 || github.ref_type == 'tag'：发版时 Release 应该同时提供安装包形态，
      # 而 tag push 的 event_name 是 push，不加这一项 MSI 会被静默跳过。
      BUILD_MSI: ${{ github.event_name == 'workflow_dispatch' && inputs.build_msi == true || github.ref_type == 'tag' }}

    steps:
      # vcpkg 的 x-gha 二进制缓存后端需要这两个运行时变量，
      # 不导出的话 vcpkg 会静默退化成不用缓存，构建时间直接翻倍。
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: wedesk-bridge
          path: ./

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # Flutter 3.24.5 的 Windows engine 缺 dropdown enableFilter 需要的接口，
      # 必须换成 RustDesk 自研 engine，否则 flutter build 直接编译失败。
      # 这里用 $(dirname $(dirname $(command -v flutter))) 推导 FLUTTER_ROOT，
      # 而不是写死 C:/hostedtoolcache/... —— 后者一旦 action 换安装路径就 404。
      - name: Replace engine with rustdesk custom flutter engine
        shell: bash
        run: |
          set -e
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_ENV"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_STEP_SUMMARY"
          flutter doctor -v
          flutter precache --windows
          curl -L --fail -o engine.zip \
            https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip
          mkdir -p engine
          unzip -q -o engine.zip -d engine
          mkdir -p "$FLUTTER_ROOT/bin/cache/artifacts/engine/windows-x64-release"
          cp -rf engine/. "$FLUTTER_ROOT/bin/cache/artifacts/engine/windows-x64-release/"
          echo "✓ engine 替换完成"

      # https://github.com/flutter/flutter/issues/155685
      - name: Patch flutter
        shell: bash
        run: |
          set -e
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          if [ "${{ env.FLUTTER_VERSION }}" != "3.24.5" ]; then
            echo "当前 Flutter 非 3.24.5，跳过 dropdown 补丁"
            exit 0
          fi
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT/"
          cd "$FLUTTER_ROOT"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          echo "✓ flutter 补丁已应用"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: wedesk-windows

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      # VCPKG_DEFAULT_HOST_TRIPLET 是这条流水线最容易踩的坑，务必保留：
      # vcpkg.json 里 ffmpeg 声明为 host:true，且 platform 条件是 `... & static`。
      # host triplet 默认取 x64-windows（动态 CRT），不满足 static 条件 ——
      # 结果 FFmpeg 被静默跳过，后面 hwcodec 编 mfx_encode.cpp 时报
      #   fatal error C1083: Cannot open include file: 'libavcodec/avcodec.h'
      # 上游 flutter-build.yml 是靠这个变量让 host 与 target triplet 一致的。
      #
      # 只在 hwcodec 打开时设成 static：不打开时保持默认 x64-windows，
      # vcpkg 就会跳过 FFmpeg（它最慢，源码编译动辄 40 分钟以上），
      # 默认构建因此能快很多。
      - name: Install vcpkg dependencies
        env:
          # 字符串写死而非引用 env.VCPKG_TRIPLET：step 级 env 里引用 env context
          # 的求值顺序不够可靠，而这里两个值必须严格可预测。
          # 改动时记得与上面的 VCPKG_TRIPLET 保持同步。
          # 用 env.ENABLE_HWCODEC 而非 inputs.hwcodec —— 后者在 push 触发时为空，
          # 会让这里静默退回 x64-windows，FFmpeg 因此被跳过。
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.ENABLE_HWCODEC == 'true' && 'x64-windows-static' || 'x64-windows' }}
        shell: bash
        run: |
          set -e
          echo "VCPKG_DEFAULT_HOST_TRIPLET=$VCPKG_DEFAULT_HOST_TRIPLET"
          echo "VCPKG_DEFAULT_HOST_TRIPLET=$VCPKG_DEFAULT_HOST_TRIPLET" >> "$GITHUB_STEP_SUMMARY"
          if ! "$VCPKG_ROOT/vcpkg" install \
              --triplet ${{ env.VCPKG_TRIPLET }} \
              --x-install-root="$VCPKG_ROOT/installed"; then
            echo "===== vcpkg 失败，输出全部 buildtree 日志 ====="
            find "$VCPKG_ROOT/buildtrees" -name "*.log" | while read -r f; do
              echo "--- $f ---"
              cat "$f"
            done
            exit 1
          fi
          # FFmpeg 是这条链路上最脆弱的一环，即使成功也留一份构建日志备查
          head -n 60 "$VCPKG_ROOT/buildtrees/ffmpeg/build-${{ env.VCPKG_TRIPLET }}-rel-out.log" 2>/dev/null || true

      # 与其让 FFmpeg 缺失以几十条 C1083 的形式暴露在 cargo 日志里，
      # 不如在这里直接说清楚缺什么、为什么会缺。
      - name: Verify FFmpeg headers (hwcodec only)
        # 必须写成 == 'true'：env 里是字符串，"false" 在 Actions 中也是 truthy
        if: ${{ env.ENABLE_HWCODEC == 'true' }}
        shell: bash
        run: |
          set -e
          INC="$VCPKG_ROOT/installed/${{ env.VCPKG_TRIPLET }}/include"
          missing=0
          for h in libavcodec/avcodec.h libavutil/pixfmt.h libavformat/avformat.h; do
            if [ -f "$INC/$h" ]; then
              echo "  [OK]   $h"
            else
              echo "  [MISS] $h"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "::error::FFmpeg 头文件缺失于 $INC —— hwcodec 编译 mfx_encode.cpp 会失败。请确认 vcpkg.json 的 ffmpeg 条目的 platform 条件被满足（需要 host triplet 为 static）。"
            ls -la "$VCPKG_ROOT/installed/" || true
            exit 1
          fi
          echo "✓ FFmpeg 头文件就位"

      # ------------------------------------------------------------------
      # 品牌注入：唯一真源是 build/custom.toml。
      # 脚本幂等 —— 源码已是目标值时什么都不会做，所以重复构建不会有脏 diff。
      # 需要临时换品牌时，在 Actions 页面手填 inputs，或在仓库 Settings 里配
      # variables.WEDESK_COMPANY / WEDESK_WEBSITE，无需改源码。
      # ------------------------------------------------------------------
      - name: Apply brand customization
        if: ${{ inputs.skip_customize != true }}
        shell: bash
        run: |
          set -e
          EXTRA=()
          COMPANY="${{ inputs.company_name }}"
          SITE="${{ inputs.website }}"
          [ -n "$COMPANY" ] && EXTRA+=(--set "brand.company_name=$COMPANY")
          [ -n "$SITE" ]    && EXTRA+=(--set "brand.website=$SITE")
          python build/customize.py --source . --config build/custom.toml "${EXTRA[@]}"

      # ------------------------------------------------------------------
      # 主构建。注意 --skip-portable-pack：便携包要等签名/加外壳，
      # 这里只要 flutter build windows 的原始 Release 目录。
      # ------------------------------------------------------------------
      - name: Build rustdesk
        shell: bash
        run: |
          set -e
          HWCODEC="${{ env.ENABLE_HWCODEC == 'true' && '--hwcodec' || '' }}"
          echo "硬件编解码: ${HWCODEC:-关闭}"
          echo "硬件编解码: ${HWCODEC:-关闭}" >> "$GITHUB_STEP_SUMMARY"
          echo "build.py 参数: --portable --flutter --skip-portable-pack $HWCODEC ${{ inputs.build_args }}"
          python ./build.py --portable --flutter --skip-portable-pack $HWCODEC ${{ inputs.build_args }}
          mkdir -p rustdesk
          cp -rf ./flutter/build/windows/x64/runner/Release/. ./rustdesk/
          ls -l ./rustdesk

      - name: Bundle usbmmidd (virtual monitor driver)
        shell: bash
        run: |
          set -e
          curl -L --fail -o usbmmidd_v2.zip \
            https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip -q -o usbmmidd_v2.zip -d usbmmidd_v2
          rm -rf usbmmidd_v2/Win32 usbmmidd_v2/deviceinstaller64.exe \
                 usbmmidd_v2/deviceinstaller.exe usbmmidd_v2/usbmmidd.bat
          cp -rf usbmmidd_v2 ./rustdesk/

      # 打印机驱动属于可选增强，下载/校验失败不应让整个构建变红
      - name: Bundle printer driver (optional)
        continue-on-error: true
        shell: bash
        run: |
          set -e
          BASE=https://github.com/rustdesk/hbb_common/releases/download/driver
          curl -L --fail -o driver.zip    "$BASE/rustdesk_printer_driver_v4-1.4.zip"
          curl -L --fail -o adapter.zip   "$BASE/printer_driver_adapter.zip"
          curl -L --fail -o sha256sums    "$BASE/sha256sums"
          sum_driver=$(awk '$2=="*rustdesk_printer_driver_v4-1.4.zip"{print $1}' sha256sums)
          sum_adapter=$(awk '$2=="*printer_driver_adapter.zip"{print $1}' sha256sums)
          [ "$(sha256sum driver.zip  | cut -d' ' -f1)" = "$sum_driver" ] || exit 1
          [ "$(sha256sum adapter.zip | cut -d' ' -f1)" = "$sum_adapter" ] || exit 1
          unzip -q -o driver.zip -d rustdesk_printer_driver_v4-1.4
          unzip -q -o adapter.zip -d printer_driver_adapter
          mkdir -p ./rustdesk/drivers
          cp -rf rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
          cp -f printer_driver_adapter/printer_driver_adapter.dll ./rustdesk/
          echo "✓ 打印机驱动已打包"

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: wedesk-windows-x64
          path: rustdesk
          retention-days: 14

      - name: Build MSI installer (optional)
        if: ${{ env.BUILD_MSI == 'true' }}
        continue-on-error: true
        shell: pwsh
        run: |
          Push-Location ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          Pop-Location
          New-Item -ItemType Directory -Force -Path ./msi-out | Out-Null
          Move-Item $msi.FullName ./msi-out/wedesk-x64.msi -Force

      - name: Upload MSI
        if: ${{ env.BUILD_MSI == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wedesk-windows-x64-msi
          path: ./msi-out
          retention-days: 14

      # 把"这次到底产出了什么"摊开写进摘要。
      # 上面修过的静默降级说明了一件事：流水线可能全绿，但产物不是想要的
      # —— hwcodec 关着、MSI 没构建，而日志里查不到任何失败。
      # 所以这里把关键开关和产物清单一并列出，扫一眼就能确认，
      # 不用去翻几千行日志找 --hwcodec 到底传没传。
      - name: Build summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Wedesk Windows 构建结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 触发方式 | \`${{ github.event_name }}\` |"
            echo "| 硬件编解码 hwcodec | ${{ env.ENABLE_HWCODEC }} |"
            echo "| MSI 安装包 | ${{ env.BUILD_MSI }} |"
            echo "| vcpkg host triplet | \`${{ env.ENABLE_HWCODEC == 'true' && 'x64-windows-static' || 'x64-windows' }}\` |"
            echo ""
            echo "### 产物 —— 在本页底部 Artifacts 区域，保留 14 天"
            echo ""
            echo "- **wedesk-windows-x64** — 便携版，解压即可运行"
            if [ "${{ env.BUILD_MSI }}" = "true" ]; then
              echo "- **wedesk-windows-x64-msi** — MSI 安装包"
            else
              echo "- MSI 未构建（本次未启用 build_msi）"
            fi
            echo ""
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo ""
              echo "> 本次是标签构建，稍后 release job 会把上述产物发布为 GitHub Release。"
            else
              echo ""
              echo "> 产物是 Actions Artifact（保留 14 天）。"
              echo "> 需要长期保存、带版本号的可分发包，请推送 \`v*\` 标签触发 Release。"
            fi
            echo ""
            echo "若上表 hwcodec 为 false 却期望开启，检查是否手动触发时取消了勾选。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. 服务端 hbbs / hbbr —— Linux musl 静态二进制
  #
  #    服务端是独立 Rust workspace（server/rustdesk-server），与客户端互不影响，
  #    所以能在同一条流水线里并行编译，互不污染 target 与工具链。
  #
  #    产物选择 musl 而非 glibc：静态链接的二进制可以扔到任意发行版上直接跑，
  #    不用管目标机器的 glibc 版本 —— 也是它能被 COPY 进 alpine 的原因。
  # ---------------------------------------------------------------------------
  build-server:
    name: hbbs/hbbr (linux musl)
    # PR 与「仅文档变更」同样跳过；逻辑与 generate-bridge 保持一致
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.should_build == 'true' }}
    needs: [preflight]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # -------------------------------------------------------------------
      # 为什么要在 musl 容器里编译，而不是在 runner 上交叉编译
      # -------------------------------------------------------------------
      # runner 是 glibc 环境。 `cargo build --target x86_64-unknown-linux-musl`
      # 会让 openssl-sys 去找【目标平台】的 OpenSSL，glibc 上的 libssl-dev 对
      # musl 无效，于是报：
      #
      #     Could not find directory of OpenSSL installation, and this `-sys`
      #     crate cannot proceed without this knowledge. ... set OPENSSL_DIR
      #
      # 手工给 musl 再喂一份 OpenSSL 并设 OPENSSL_DIR 当然能过，但那套路径绑死
      # 宿主发行版与 runner 镜像版本，一个 update 就失效。换成本机编译：容器的
      # host triple 本身就是 musl，alpine 的 openssl-dev/sqlite-dev 天生是给
      # musl 编的，pkg-config 一查即中，产物照样是 musl 静态二进制。
      #
      # 编译命令不在这里 —— 它在 server/build-musl.sh，与 server/Dockerfile
      # 共用同一份。两份配方一旦各自漂移，就会出现「CI 绿但本机 docker build 红」
      # 这种最难复盘的故障。
      #
      # 挂载 $HOME/.cargo/registry 是为了让 rust-cache 管到依赖包缓存；
      # 挂 target 则直接落回仓库里，下一个 job/step 照原路径取用。
      # -------------------------------------------------------------------
      # workspaces 必须显式指定：
      # rust-cache 默认按仓库根推断 target，而服务端是独立 workspace + 非默认 target，
      # 不写这一行就缓存不命中，每次都从零重编十几个依赖包。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.SERVER_DIR }} -> target/${{ env.SERVER_TARGET }}

      - name: Build hbbs / hbbr / rustdesk-utils in musl container
        id: build
        run: |
          set -e
          # TRIPLE 只在这里定一次，并作为 step output 交给下面的打包步骤。
          # 之前打包步骤直接读 env.SERVER_TARGET，而脚本在未收到 TARGET 时会
          # 退回自己的默认值 —— 两个真源，env 一漏配就变成「编译放到
          # target/x86_64-...-musl/、打包却去 target//release 找」的错位。
          TRIPLE="${SERVER_TARGET:-x86_64-unknown-linux-musl}"
          echo "triple=$TRIPLE" >> "$GITHUB_OUTPUT"
          echo "==> 编译目标三元组：$TRIPLE"
          mkdir -p "$HOME/.cargo/registry" "${SERVER_DIR}/target"
          docker run --rm \
            --volume "$PWD/${SERVER_DIR}:/src" \
            --volume "$PWD/server/build-musl.sh:/build-musl.sh:ro" \
            --volume "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            --env TARGET="$TRIPLE" \
            "${SERVER_BUILD_IMAGE}" \
            sh /build-musl.sh
          # 容器里是 root，写出来 target/ 与 registry 缓存都归 root；
          # 后面的 upload-artifact 与 rust-cache 由 runner 用户执行会读不到。
          sudo chown -R "$(id -u):$(id -g)" \
            "$HOME/.cargo/registry" "${SERVER_DIR}/target"

      - name: Package server binaries
        id: pack
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          set -e
          V="$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          DIST="$GITHUB_WORKSPACE/out-server"
          mkdir -p "$DIST"
          # 路径由上一个 step 实际使用的三元组决定，不再各自取值。
          BIN="target/${{ steps.build.outputs.triple }}/release"
          if [ ! -f "$BIN/hbbs" ]; then
            # 兜底：没传 --target 时 cargo 直接放在 target/release
            if [ -f "target/release/hbbs" ]; then
              echo "::warning::$BIN/hbbs 不存在，回退到 target/release（未传 --target 时的产物位置）"
              BIN="target/release"
            else
              echo "::error::找不到编译产物。当前 target/ 下的目录结构："
              find target -maxdepth 3 -type d 2>/dev/null | head -30
              echo "::error::以及存在的二进制："
              find target -maxdepth 4 -type f -name 'hbbs' 2>/dev/null | head
              exit 1
            fi
          fi
          for b in hbbs hbbr rustdesk-utils; do cp "$BIN/$b" "$DIST/"; done
          # systemd 单元带上：不用 Docker 的部署方式直接落到 /etc/systemd/system 即可
          [ -d systemd ] && cp -r systemd "$DIST/systemd"
          (cd "$DIST" && sha256sum hbbs hbbr rustdesk-utils > SHA256SUMS.txt)
          (cd "$DIST" && zip -q -r "$DIST/wedesk-server-${V}-linux-x64-musl.zip" \
              hbbs hbbr rustdesk-utils systemd SHA256SUMS.txt)
          echo "=== 服务端产物 ==="
          ls -lh "$DIST"

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: wedesk-server-linux-x64
          path: out-server
          retention-days: 14

      - name: Server build summary
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          {
            echo "## Wedesk 服务端构建结果"
            echo ""
            echo "- hbbs / hbbr / rustdesk-utils：**musl 静态二进制**，任意 Linux 发行版可直接运行"
            echo "- 版本：\`${{ steps.pack.outputs.version }}\`（取自 server/rustdesk-server/Cargo.toml）"
            echo "- 含 systemd 单元，不用 Docker 也能部署"
            echo "- 镜像版本由下一个 \`Push server image\` job 推送到 GHCR"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4. 服务端容器镜像 —— 推到自己账号的 GHCR，与官方镜像再无关系
  #
  #    这里刻意用 Dockerfile.prebuilt 而不是 server/Dockerfile：
  #    后者在容器里从源码编译（方便本机零 Rust 环境构建），
  #    而 CI 里二进制刚在上一个 job 编完，直接 COPY 进去即可，
  #    否则同一个 workspace 要在容器里再编译一遍十几分钟。
  # ---------------------------------------------------------------------------
  server-image:
    name: Push server image (GHCR)
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.should_build == 'true' }}
    needs: [build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: wedesk-server-linux-x64
          path: dist-server

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wedesk-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=tag

      # 只有发版和手动触发才真正推送。
      # push=false 时 build-push-action 依然会完整构建 —— 日常提交也能验证
      # Dockerfile 没被改坏，这是它比"干脆不跑"值钱的地方。
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./dist-server
          file: ./server/Dockerfile.prebuilt
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=wedesk-server-image
          cache-to: type=gha,scope=wedesk-server-image,mode=max

      - name: Image summary
        run: |
          {
            echo "## 服务端镜像"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 镜像 | \`ghcr.io/${{ github.repository_owner }}/wedesk-server\` |"
            echo "| 是否推送 | ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }} |"
            echo "| 标签 | \`${{ github.ref_type == 'tag' && github.ref_name || 'sha' }}\` |"
            echo ""
            echo "拉取：\`docker pull ghcr.io/${{ github.repository_owner }}/wedesk-server:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. 发布 GitHub Release（仅 v* 标签）
  #
  #    为什么单独一个 job 而不在 build-windows 里顺手做：
  #    发布需要 contents: write 权限。单独一个 job 能把权限收敛到最小范围，
  #    构建环节依然只有 read —— 构建机上的第三方 action 碰不到发布能力。
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    # 服务端编译失败不应阻断客户端发布 —— 两者是独立产物，
    # 用户仍可拿到客户端；服务端缺失会在 Release Notes 里标注。
    # 但如果客户端本身没成功，就什么都不发：没有客户端的 Release 没有意义。
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && needs.build-windows.result == 'success' }}
    needs: [build-windows, build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # 版本号必须与 Cargo.toml 一致。发错的 Recovery 成本远高于构建失败：
      # 发出去的版本号是错的，用户下载后无法判断自己装的是什么，
      # 而删除重发又会让已发出去的链接失效。
      - name: 校验标签版本与 Cargo.toml 一致
        id: ver
        shell: bash
        run: |
          set -e
          CARGO_VER="$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          TAG="$GITHUB_REF_NAME"
          TAG_VER="${TAG#v}"
          echo "Cargo.toml 版本: $CARGO_VER"
          echo "标签:            $TAG （解析为 $TAG_VER）"
          if [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "::error::标签 $TAG 与 Cargo.toml 的 $CARGO_VER 不一致。"
            echo "::error::请先对齐版本再打标签 —— 用 build/tag-release.bat 可自动取 Cargo.toml 的版本号。"
            exit 1
          fi
          echo "version=$CARGO_VER" >> "$GITHUB_OUTPUT"
          # v1.2.3-beta.1 / -rc1 算预发布：不抢 latest 标签
          case "$TAG_VER" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # 只警告不阻断：偶尔确有需要在非 main 提交上发版的场景
      - name: 检查标签是否指向 main
        shell: bash
        run: |
          set -e
          git fetch origin main 2>/dev/null || true
          if git rev-parse --verify -q origin/main >/dev/null; then
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main 2>/dev/null; then
              echo "✓ 标签指向的提交已在 main 上"
            else
              echo "::warning::标签指向的提交不在 main 上 —— 请确认这是预期的发布点"
            fi
          else
            echo "::warning::取不到 origin/main，跳过分支归属校验"
          fi

      - name: 下载便携版
        uses: actions/download-artifact@v4
        with:
          name: wedesk-windows-x64
          path: dist/portable

      - name: 下载 MSI（若构建）
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wedesk-windows-x64-msi
          path: dist/msi

      # 服务端缺失不阻断发布：它是 continue-on-error 的兄弟产物
      - name: 下载服务端（若构建）
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wedesk-server-linux-x64
          path: dist/server

      - name: 打包并生成校验和
        id: pack
        shell: bash
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          mkdir -p out
          # exe 名由 build.py 决定（当前硬编码 rustdesk.exe），不写死，
          # 免得以后改了名字 Release 说明还在指向不存在的文件
          EXE="$(cd dist/portable && ls *.exe 2>/dev/null | head -1 || true)"
          echo "exe=${EXE:-rustdesk.exe}" >> "$GITHUB_OUTPUT"
          (cd dist/portable && zip -q -r "$GITHUB_WORKSPACE/out/wedesk-${V}-windows-x64-portable.zip" .)
          if [ -f dist/msi/wedesk-x64.msi ]; then
            cp -f dist/msi/wedesk-x64.msi "out/wedesk-${V}-windows-x64.msi"
            echo "has_msi=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_msi=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未找到 MSI，本次 Release 只含便携版"
          fi
          # 服务端：CI 已经打好了 zip，这里原样带过去不再二次压缩，
          # 免得 Release 里的 zip 与 CI artifact 的 SHA256 对不上
          has_server=false
          if [ -f dist/server/hbbs ]; then
            cp -f dist/server/*.zip out/ 2>/dev/null || true
            cp -f dist/server/hbbs dist/server/hbbr dist/server/rustdesk-utils out/
            has_server=true
          else
            echo "::warning::未找到服务端产物（build-server job 可能失败或被跳过）"
          fi
          echo "has_server=$has_server" >> "$GITHUB_OUTPUT"
          cd out
          sha256sum ./* > SHA256SUMS.txt
          echo "=== 待发布文件 ==="
          ls -lh
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: 生成 Release Notes
        shell: bash
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          TAG="$GITHUB_REF_NAME"
          EXE="${{ steps.pack.outputs.exe }}"
          REPO="${{ github.repository }}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          SERVER_PKG="$(ls dist/server/*.zip 2>/dev/null | head -1 | xargs -r basename || true)"
          {
            echo "## 企业网管助手 v${V}"
            echo ""
            echo "客户端已内置私有服务器地址与公钥，服务端由本仓库源码自行编译 —— 两者配套发布。"
            echo ""
            echo "### 客户端（Windows x64）"
            echo ""
            echo "| 文件 | 说明 |"
            echo "|---|---|"
            echo "| \`wedesk-${V}-windows-x64-portable.zip\` | 便携版：解压后运行 \`${EXE}\`，无需安装 |"
            if [ "${{ steps.pack.outputs.has_msi }}" = "true" ]; then
              echo "| \`wedesk-${V}-windows-x64.msi\` | 安装包：适合域控 / 组策略批量部署 |"
            fi
            echo ""
            echo "### 服务端（Linux x64 / musl 静态）"
            echo ""
            if [ "${{ steps.pack.outputs.has_server }}" = "true" ]; then
              echo "自行编译的 hbbs / hbbr，非官方镜像；已关闭向 api.rustdesk.com 的版本检查。"
              echo ""
              echo "| 文件 | 说明 |"
              echo "|---|---|"
              echo "| \`${SERVER_PKG}\` | 含 hbbs / hbbr / rustdesk-utils 与 systemd 单元 |"
              echo "| \`hbbs\` / \`hbbr\` / \`rustdesk-utils\` | 裸二进制，musl 静态链接，任意发行版可直接运行 |"
              echo "| 容器镜像 \`ghcr.io/${{ github.repository_owner }}/wedesk-server:latest\` | 本版镜像，\`docker pull\` 即可 |"
            else
              echo "::warning::本次未产出服务端二进制 —— 请查看 build-server job 日志"
              echo "本次未随附服务端二进制（构建未成功）。使用上一版本或本地构建："
              echo "\`\`\`bash"
              echo "cd server && docker build -t wedesk-server:latest ."
              echo "\`\`\`"
            fi
            echo ""
            echo "| \`SHA256SUMS.txt\` | 上述全部文件的校验和，分发前请核对 |"
            echo ""
            echo "### 更新内容"
            echo ""
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "$PREV..$TAG"
              echo ""
              echo ""
              echo "完整对比：[\`${PREV}...${TAG}\`](https://github.com/${REPO}/compare/${PREV}...${TAG})"
            else
              echo "- 首个版本"
            fi
            echo ""
            echo "### 部署提示"
            echo ""
            echo "- 服务端需与本客户端使用**同一套密钥**，否则连不上"
            echo "- 便携版请整体拷贝目录，单独拷 exe 会缺依赖 DLL 与驱动"
            echo "- 首次被控若提示安装虚拟显示器驱动（usbmmidd），允许即可"
            echo ""
            echo "详细步骤见 [部署指南](https://github.com/${REPO}/blob/main/docs/04-deploy.md)。"
            echo ""
            echo "### 许可证"
            echo ""
            echo "本软件基于 RustDesk 二次开发，遵循 **AGPL-3.0**。"
            echo "下方 Source code 附件由 GitHub 自动生成，即完整源码，满足许可证要求。"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "wedesk v${{ steps.ver.outputs.version }}"
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.ver.outputs.prerelease != 'true' }}
          # MSI / 服务端缺失是允许的（构建步骤有 continue-on-error 保护），
          # 但不该因为少一个文件就让整个 Release 失败
          fail_on_unmatched_files: false
          files: |
            out/*.zip
            out/*.msi
            out/SHA256SUMS.txt
            out/hbbs
            out/hbbr
            out/rustdesk-utils

      - name: Release 摘要
        shell: bash
        run: |
          {
            echo "## Release 已发布"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`v${{ steps.ver.outputs.version }}\` |"
            echo "| 预发布 | ${{ steps.ver.outputs.prerelease }} |"
            echo "| 含 MSI | ${{ steps.pack.outputs.has_msi }} |"
            echo "| 含服务端 hbbs/hbbr | ${{ steps.pack.outputs.has_server }} |"
            echo "| 服务端镜像 | \`ghcr.io/${{ github.repository_owner }}/wedesk-server:latest\` |"
            echo "| 地址 | ${{ steps.publish.outputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
