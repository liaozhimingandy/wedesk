# =============================================================================
# RustDesk 定制客户端配置 —— 唯一需要你修改的文件
# =============================================================================
# 改好后执行：
#     python customize.py --source <rustdesk源码路径> --config custom.toml --dry-run
# 确认输出符合预期后去掉 --dry-run 正式写入。
# =============================================================================

[server]
# ============================ 自建服务器 ============================
# ID/注册服务器地址，可写域名或 IP。不带端口时自动使用 21116。
#  !! 不要用环回地址，必须填客户端真正能连到的那个地址 !!
rendezvous_host = "192.168.2.114"

# 服务器公钥：hbbs 首次启动后生成的 id_ed25519.pub 内容。
#  获取方式： cd ../server && python rdctl.py key
#  !! 必须与你服务器上的公钥完全一致，否则所有连接都会被拒绝 !!
#  当前值来自本机自建服务器 D:\Git\wedesk\server\data\id_ed25519.pub
#  换服务器后务必重新获取并替换，然后重新构建客户端。
key = "bMwHjGjrhpNvD+lyhx2daVmrhmq94hyDfHNisznZTl0="

# 中继服务器地址。留空表示与 rendezvous_host 同机、使用 21117 默认端口。
relay_host = "192.168.2.114:21117"


[brand]
# ============================== 品牌定制 ==============================
# 界面、标题栏、exe 名称中显示的产品名
app_name = "企业网管助手"

# 生成的可执行文件名（不含 .exe），只能用小写字母与数字，避免路径问题
exe_name = "nethelper"

# 显示在"关于"与 Windows 属性里的公司名
company_name = "贵公司名称"

# 官网域名，用于替换界面里的帮助/隐私政策链接
website = "https://example.com"


[advanced]
# ============================== 进阶选项 ==============================
# 移除源码中向官方 admin.rustdesk.com 发起请求的兜底地址。
# 定制客户端用不上官方 API，置空可保证客户端不与任何官方域名通信。
# 强烈建议保持 true —— 这是"数据不出内网"合规要求的关键一环。
remove_official_api_fallback = true
